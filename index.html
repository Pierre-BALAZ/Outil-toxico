<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071226">
<title>Aide Toxico</title>
<style>
:root{
--bg:#071226; --bg2:#050D1C; --card:#0B1A31; --card2:#0E2140; --line:#17304F;
--ink:#E7EFFA; --ink2:#FFFFFF; --muted:#8CA4C4;
--accent:#4D9BE6; --accent2:#89D6FF; --deep:#194294; --sand:#FFEDC6; --water:#6EB0D9;
--g1:#49BE7C; --g2:#EDB64B; --g3:#F08A4B; --g4:#EF5F62;
--sero:#F0894A; --adren:#E3B54C; --anticho:#EF5F62; --aoste:#A982E8;
--cholin:#5FC46E; --hypno:#5B9BE8; --opio:#89D6FF;
--r:16px; --rail:60px;
}
:root[data-theme="light"]{
--bg:#F3F5F9; --bg2:#E9EDF4; --card:#FFFFFF; --card2:#F6F8FC; --line:#D9E1EC;
--ink:#0C1B2E; --ink2:#071226; --muted:#5A6B82;
--accent:#1B5FA8; --accent2:#2E86C9; --deep:#194294;
--g1:#2E7D45; --g2:#B57F10; --g3:#C9601F; --g4:#C62B2E;
--sero:#D4661F; --adren:#A8780F; --anticho:#C62B2E; --aoste:#6C45B0;
--cholin:#2E7D32; --hypno:#1B5FA8; --opio:#2B6FD1;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
background:var(--bg);color:var(--ink);line-height:1.45;-webkit-tap-highlight-color:transparent;
padding-right:calc(var(--rail) + env(safe-area-inset-right));padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;
padding:9px 14px;display:flex;align-items:center;gap:11px}
.logo{display:none}
.logo{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);
display:grid;place-items:center;flex:none}
.brand{font-weight:800;letter-spacing:.02em;font-size:1rem;line-height:1.15;color:var(--ink2)}
.brand small{display:block;font-size:.65rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
@media(max-width:359px){.brand{font-size:.92rem}.brand small{font-size:.58rem;letter-spacing:.02em}}
.hbtns{margin-left:auto;display:flex;gap:6px}
.ibtn{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;
width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:17px;height:17px}
nav{position:fixed;right:0;top:0;bottom:0;width:calc(var(--rail) + env(safe-area-inset-right));
z-index:60;background:var(--bg2);border-left:1px solid var(--line);display:flex;
flex-direction:column;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
padding:7px env(safe-area-inset-right) calc(10px + env(safe-area-inset-bottom)) 0;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav .rlogo{width:34px;height:34px;border-radius:50%;background:var(--card2);border:1px solid var(--line);
display:grid;place-items:center;margin:1px auto 7px;flex:none}
nav .rlogo svg{width:19px;height:19px}
nav button{flex:none;width:100%;border:0;background:none;color:var(--muted);font:inherit;
font-size:.5rem;font-weight:700;line-height:1.15;padding:7px 2px;cursor:pointer;display:flex;
flex-direction:column;align-items:center;gap:4px;border-left:3px solid transparent;text-align:center;
word-break:break-word;hyphens:auto}
nav button svg{width:19px;height:19px;flex:none}
nav button.on{color:var(--accent2);border-left-color:var(--accent2);background:color-mix(in srgb,var(--accent) 10%,transparent)}
@media(min-width:900px){
:root{--rail:104px}
nav button{font-size:.66rem;padding:10px 6px;gap:5px}
nav button svg{width:21px;height:21px}
nav .rlogo{width:42px;height:42px;margin-bottom:10px}
nav .rlogo svg{width:23px;height:23px}
}
#backbar{position:sticky;top:0;z-index:35;background:var(--bg);border-bottom:1px solid var(--line);
display:none;align-items:center;gap:9px;padding:7px 14px;margin:0 -14px 12px}
#backbar.on{display:flex}
#backbar .bk{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card2);
color:var(--ink);border-radius:999px;padding:6px 13px 6px 9px;font:inherit;font-size:.8rem;
font-weight:750;cursor:pointer;min-height:34px}
#backbar .bk svg{width:14px;height:14px}
#backbar .bk:active{transform:scale(.96)}
#backbar .bt{font-size:.78rem;font-weight:700;color:var(--muted);overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:14px}
section{display:none} section.on{display:block}
h2.pt{font-size:1.28rem;font-weight:800;margin-bottom:3px;letter-spacing:-.01em;color:var(--ink2)}
p.ps{font-size:.85rem;color:var(--muted);margin-bottom:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:11px}
.card.pad0{padding:0;overflow:hidden}
.lbl{font-size:.67rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted);margin-bottom:7px}
.muted{color:var(--muted)} .sm{font-size:.85rem} .xs{font-size:.76rem}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-bottom:6px}
.cbtn{background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;
color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:8px;padding:16px 12px;text-align:center;position:relative;overflow:hidden;min-height:124px;
transition:border-color .15s,transform .1s}
.cbtn:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,
color-mix(in srgb,var(--qc) 24%,transparent),transparent 72%);pointer-events:none}
.cbtn:active{transform:scale(.98)}
.cbtn:hover{border-color:var(--qc)}
.cbtn svg{width:34px;height:34px;color:var(--qc);position:relative;z-index:1}
.cbtn .cn{font-weight:800;font-size:.88rem;line-height:1.25;z-index:1;position:relative;color:var(--ink2)}
.cbtn .cc{font-size:.72rem;color:var(--muted);font-weight:700;z-index:1;position:relative}
.catbar{display:flex;align-items:center;gap:9px;margin:0 0 12px}
.catbar .cic svg{width:24px;height:24px}
.catbar h3{font-size:1.02rem;font-weight:800;color:var(--ink2);margin:0}
.catret{background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
font:inherit;font-weight:750;font-size:.8rem;padding:7px 12px;cursor:pointer;display:inline-flex;
align-items:center;gap:6px;margin-bottom:12px}
.catret:active{transform:scale(.98)}
.quad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;
aspect-ratio:1/1;max-width:560px;margin:0 auto 16px}
.qbtn{background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;
color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:10px;padding:14px;text-align:center;position:relative;overflow:hidden;
transition:border-color .15s,transform .1s}
.qbtn:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,
color-mix(in srgb,var(--qc) 26%,transparent),transparent 72%);pointer-events:none}
.qbtn:active{transform:scale(.98)}
.qbtn:hover{border-color:var(--qc)}
.qbtn svg{width:46px;height:46px;color:var(--qc);position:relative;z-index:1}
.qbtn .qn{font-weight:800;font-size:.95rem;line-height:1.25;position:relative;z-index:1;color:var(--ink2)}
.qbtn .qd{font-size:.71rem;color:var(--muted);line-height:1.3;position:relative;z-index:1}
@media(max-width:400px){.qbtn svg{width:36px;height:36px}.qbtn .qn{font-size:.85rem}.qbtn .qd{display:none}}
.srow{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.sbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 11px;
cursor:pointer;font:inherit;color:var(--ink);text-align:left;display:flex;align-items:center;gap:9px;font-size:.84rem;font-weight:700}
.sbtn svg{width:16px;height:16px;color:var(--accent);flex:none}
.sbtn:active{transform:scale(.98)}
label.fl{display:block;font-size:.69rem;font-weight:800;color:var(--muted);margin-bottom:5px;
text-transform:uppercase;letter-spacing:.06em}
input,select{font:inherit;color:var(--ink);background:var(--card2);
border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent2);height:30px}
input::placeholder{color:var(--muted);opacity:.75}
.grid3{display:grid;grid-template-columns:1fr 1fr .85fr;gap:9px}
.row{display:flex;gap:8px;align-items:center}
.b{font:inherit;display:inline-block;text-align:center;font-weight:700;font-size:.84rem;border:1.5px solid var(--line);
background:var(--card2);color:var(--ink);border-radius:10px;padding:9px 13px;cursor:pointer;white-space:nowrap}
.b.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.b.gho{background:none;border-style:dashed;color:var(--accent2);border-color:var(--accent)}
.b:active{transform:scale(.97)}
.sw{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:.8rem;font-weight:700;user-select:none}
.sw input{display:none}
.sw i{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .18s;flex:none}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
background:var(--muted);transition:transform .18s,background .18s}
.sw input:checked + i{background:color-mix(in srgb,var(--g3) 55%,transparent)}
.sw input:checked + i:after{transform:translateX(16px);background:var(--g3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card2);border-radius:10px;padding:7px 10px;
font-size:.85rem;font-weight:650;user-select:none;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pup{border-radius:50%;border:2px solid currentColor;background:#fff;display:inline-flex;
align-items:center;justify-content:center;flex:none}
.pup i{display:block;border-radius:50%;background:#000}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gauge{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.gauge .gt{font-size:.63rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted)}
.gauge .gv{font-size:.98rem;font-weight:800;margin:3px 0 7px;line-height:1.2}
.bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s,background .3s}
.bar u{position:absolute;top:0;bottom:0;pointer-events:none;
background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--ink) 42%,transparent) 0 3px,transparent 3px 7px)}
.gauge.nod{opacity:.72}
.gauge.nod .bar{background:repeating-linear-gradient(45deg,var(--line) 0 6px,transparent 6px 12px)}
.mhit{display:flex;flex-wrap:wrap;gap:4px;padding:0 13px 9px;margin-top:-4px}
.mhit:empty{display:none}
.ticks{display:flex;justify-content:space-between;font-size:.59rem;color:var(--muted);margin-top:4px;font-weight:700}
.alertbox{border-radius:12px;padding:10px 12px;margin-bottom:10px;border-left:5px solid;font-size:.86rem}
.a0{background:color-mix(in srgb,var(--g1) 13%,transparent);border-color:var(--g1)}
.a1{background:color-mix(in srgb,var(--g2) 15%,transparent);border-color:var(--g2)}
.a2{background:color-mix(in srgb,var(--g3) 15%,transparent);border-color:var(--g3)}
.a3{background:color-mix(in srgb,var(--g4) 15%,transparent);border-color:var(--g4)}
.ai{background:color-mix(in srgb,var(--accent) 13%,transparent);border-color:var(--accent)}
.alertbox b{display:block;font-size:.92rem;margin-bottom:2px;color:var(--ink2)}
.kv{width:100%;border-collapse:collapse;font-size:.85rem}
.kv th{text-align:left;color:var(--muted);font-weight:650;padding:6px 10px 6px 0;vertical-align:top;
width:36%;border-top:1px solid var(--line);font-size:.79rem}
.kv td{padding:6px 0;border-top:1px solid var(--line);font-weight:600}
.kv tr:first-child th,.kv tr:first-child td{border-top:0}
ul.li{list-style:none;font-size:.86rem}
ul.li li{padding:4px 0 4px 15px;position:relative}
ul.li li:before{content:"";position:absolute;left:2px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.azbar{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin:9px 0 4px}
.azbar button{font:800 .74rem/1 inherit;padding:7px 0;border-radius:7px;cursor:pointer;
border:1px solid var(--line);background:var(--card2);color:var(--accent2)}
.azbar button:disabled{opacity:.3;cursor:default;color:var(--muted)}
.alph{padding:6px 13px;font-weight:800;font-size:.78rem;
letter-spacing:.06em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,var(--card))}
.flash{animation:fl 1.1s ease-out}
@keyframes fl{from{background:color-mix(in srgb,var(--accent) 30%,transparent)}to{background:transparent}}
.itm{margin:7px 0}
.itm>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;padding:10px 13px;
border-radius:11px;font-weight:800;font-size:1rem;line-height:1.25;
background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent2)}
.itm>summary::-webkit-details-marker{display:none}
.itm>summary:after{content:"›";margin-left:auto;font-size:1.35rem;line-height:1;opacity:.75;
transition:transform .2s;flex:none}
.itm[open]>summary:after{transform:rotate(90deg)}
.itm>.inn{padding:10px 4px 6px}
.itm .cnt{font-size:.68rem;font-weight:800;padding:1px 7px;border-radius:999px;flex:none;
background:var(--accent);color:#fff}
.itm.tech>summary{background:color-mix(in srgb,var(--tc) 17%,transparent);color:var(--tc)}
.acc{border:1px solid var(--line);border-radius:13px;margin-bottom:8px;background:var(--card);overflow:hidden}
.acc>summary{padding:12px 14px;font-weight:750;cursor:pointer;list-style:none;display:flex;
align-items:center;gap:9px;font-size:.93rem}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .cic{display:grid;place-items:center;color:var(--accent2);flex:none}
.acc>summary .cic svg{width:18px;height:18px}
.acc>summary:after{content:"›";margin-left:auto;font-size:1.3rem;color:var(--muted);transition:transform .2s;line-height:1}
.acc[open]>summary:after{transform:rotate(90deg)}
.acc .inn{padding:0 14px 13px}
.tag{display:inline-block;font-size:.65rem;font-weight:800;padding:2px 7px;border-radius:999px;
background:var(--card2);border:1px solid var(--line);color:var(--muted);margin:0 4px 4px 0}
.tag.red{background:color-mix(in srgb,var(--g4) 18%,transparent);border-color:transparent;color:var(--g4)}
.tag.grn{background:color-mix(in srgb,var(--g1) 18%,transparent);border-color:transparent;color:var(--g1)}
.tag.amb{background:color-mix(in srgb,var(--g2) 20%,transparent);border-color:transparent;color:var(--g2)}
.tag.blu{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:transparent;color:var(--accent2)}
.tag.lp{background:color-mix(in srgb,var(--g3) 20%,transparent);border-color:transparent;color:var(--g3)}
.ep{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;font-weight:800;padding:3px 8px;
border-radius:999px;margin:0 4px 4px 0;border:1px solid}
.ep svg{width:12px;height:12px}
.ep.EER{color:#EDB64B;border-color:color-mix(in srgb,#EDB64B 45%,transparent);background:color-mix(in srgb,#EDB64B 13%,transparent)}
.ep.ECMO{color:#E87BC0;border-color:color-mix(in srgb,#E87BC0 45%,transparent);background:color-mix(in srgb,#E87BC0 13%,transparent)}
.dsc{color:var(--g2)!important;border-left:2px solid color-mix(in srgb,var(--g2) 55%,transparent);padding-left:7px!important}
.xtr{display:inline-block;font-size:.64rem;font-weight:800;padding:1px 7px;border-radius:999px;
background:color-mix(in srgb,var(--g3) 20%,transparent);color:var(--g3);letter-spacing:.02em;vertical-align:1px}
.ep.cha{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 35%,transparent);background:color-mix(in srgb,var(--ink) 10%,transparent)}
.ep.cha.off{color:var(--muted);border-color:var(--line);background:none;text-decoration:line-through}
.ep.MARS{color:#5BA8E8;border-color:color-mix(in srgb,#5BA8E8 45%,transparent);background:color-mix(in srgb,#5BA8E8 13%,transparent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;
cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.tile:active{transform:scale(.98)}
.tile .tn{font-weight:750;font-size:.89rem;color:var(--ink2)}
.tile .td{font-size:.73rem;color:var(--muted);margin-top:3px;line-height:1.35}
.med{border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;
padding:11px 14px;cursor:pointer;font:inherit;color:var(--ink);display:flex;align-items:center;gap:10px}
.med:last-child{border-bottom:0}
.med:active{background:var(--card2)}
.med .mn{font-weight:720;font-size:.91rem;color:var(--ink2)}
.med .mc{font-size:.73rem;color:var(--muted);margin-top:1px}
.med .ma{margin-left:auto;color:var(--muted);font-size:1.1rem}
.ta{display:grid;grid-template-columns:1fr 26px 1fr;gap:8px;align-items:center;
padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer;background:none;
border-left:0;border-right:0;border-top:0;width:100%;font:inherit;color:var(--ink);text-align:left}
.ta:last-child{border-bottom:0}
.ta:active{background:var(--card2)}
.ta .tox{font-weight:750;font-size:.87rem;color:var(--ink2)}
.ta .arr{color:var(--accent2);text-align:center;font-size:1.1rem;font-weight:700}
.ta .ant{font-weight:700;font-size:.87rem;color:var(--accent2)}
.ta .ep{margin-top:3px}
@media(max-width:560px){.ta{grid-template-columns:1fr;gap:3px}.ta .arr{text-align:left;font-size:.95rem}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;
align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;width:100%;max-width:720px;
max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 15px calc(26px + env(safe-area-inset-bottom))}
.sheet h3{font-size:1.16rem;font-weight:800;color:var(--ink2)}
.shclose{position:sticky;top:0;float:right;background:var(--card2);border:1px solid var(--line);
width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--ink);z-index:2;font-size:.95rem}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px;max-height:84vh;border-bottom:1px solid var(--line)}}
svg.plot{width:100%;height:auto;display:block}
.plot .ax{stroke:var(--ink);stroke-width:1.4;opacity:.75}
.plot .grid{stroke:var(--line);stroke-width:1}
.plot text{font-family:inherit;fill:var(--ink)}
.plot .al{font-size:10px;fill:var(--muted);font-weight:700;letter-spacing:.04em}
.plot .pl{font-size:10px;font-weight:800}
.plot .guide{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;opacity:.5}
.capt{font-size:.73rem;color:var(--muted);text-align:center;margin-top:5px;font-weight:600;line-height:1.5}
.frise{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:4px}
.fb{border-top:4px solid var(--fc);background:var(--card2);border-radius:0 0 10px 10px;padding:8px 9px 10px;
display:flex;flex-direction:column;gap:7px}
.fb .fh{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--fc)}
.fb .fm b{display:block;font-size:.84rem;color:var(--ink2);font-weight:800}
.fb .fm span{display:block;font-size:.74rem;color:var(--muted)}
.fb .fm em{display:block;font-size:.7rem;color:var(--muted);font-style:italic;margin-top:2px;line-height:1.35}
@media(max-width:620px){
.frise{grid-template-columns:1fr;gap:0}
.fb{border-top:0;border-left:4px solid var(--fc);border-radius:0 10px 10px 0;margin-bottom:6px}
}

.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:.9rem}
.mole{border:1px solid var(--line);border-radius:13px;background:var(--card2);padding:11px;margin-bottom:9px}
.mole .mh{display:flex;align-items:center;gap:8px;margin-bottom:9px}

function solveKa(t12,tmax){
const ke=Math.LN2/t12;
if(!(tmax>0)||tmax>=1/ke) return ke*6;
let lo=ke*1.0001, hi=ke*5000;
const f=ka=>Math.log(ka/ke)/(ka-ke)-tmax;
if(f(hi)>0) return hi;
for(let i=0;i<80;i++){ const m=(lo+hi)/2; if(f(m)>0) lo=m; else hi=m; }
return (lo+hi)/2;
}
const conc=(t,ke,ka)=> t<=0?0:(ka/(ka-ke))*(Math.exp(-ke*t)-Math.exp(-ka*t));

const ke=Math.LN2/t12, ka=solveKa(t12,tmax), peak=conc(tmax,ke,ka)||1, pts=[];
for(let i=0;i<=160;i++){ const t=tEnd*i/160; pts.push([t,conc(t,ke,ka)/peak]); }
return {pts, at:t=>conc(t,ke,ka)/peak};
}

// position d'une dose sur la jauge, de 0 à 100 % : sert au curseur et aux bornes
// de la zone de discordance, qui doivent être placées sur la même échelle.
function pctDose(by,doseMg){
const t1=by[1]&&by[1].mg, t2=by[2]&&by[2].mg, t3=by[3]&&by[3].mg;
const seg=(a,b,lo,hi)=>Math.max(lo,Math.min(hi,lo+(hi-lo)*(doseMg-a)/Math.max(b-a,1e-9)));
if(t1&&doseMg<t1) return Math.min(24,24*doseMg/t1);
if(t1&&t2&&doseMg<t2) return seg(t1,t2,25,49);
if(t2&&t3&&doseMg<t3) return seg(t2,t3,50,74);
if(t3&&doseMg>=t3) return Math.min(100,75+25*Math.min(1,(doseMg-t3)/t3));
if(t2&&doseMg>=t2) return Math.min(90,50+40*Math.min(1,(doseMg-t2)/t2));
if(t1&&doseMg>=t1) return Math.min(70,25+45*Math.min(1,(doseMg-t1)/t1));
return 10;
}
// bande hachurée : intervalle de doses sur lequel deux sources sûres ne s'accordent pas
function zoneDisc(m,g,poids){
if(!m.dz||!g.by) return "";
const k=m.dz.u==="mg/kg"?poids:1, lo=pctDose(g.by,m.dz.lo*k), hi=pctDose(g.by,m.dz.hi*k);
if(!(hi>lo)) return "";
return `<u style="left:${lo}%;width:${hi-lo}%"></u>`;
}
function gravite(med,doseMg,poids,isUI){
const list=med.s.map(t=>({lv:t[0],mg:isUI?thrUI(t):thrMg(t,poids),lbl:t[3]})).filter(x=>x.mg!=null);
if(!list.length) return {lv:-1,pct:0,list:[],next:null};
let lv=0, cross=null;
list.forEach(x=>{ if(doseMg>=x.mg && x.lv>lv){ lv=x.lv; cross=x; } });
const by={}; list.forEach(x=>{ if(!by[x.lv]||x.mg<by[x.lv].mg) by[x.lv]=x; });
const pct=pctDose(by,doseMg);
return {lv,pct,cross,list,by,next:list.filter(x=>x.mg>doseMg).sort((a,b)=>a.mg-b.mg)[0]||null};
}

function plotPK(cv,m,h){
const W=400,H=214,L=34,R=388,T=14,B=172;
const tEnd=cv.pts[cv.pts.length-1][0];
const X=t=>L+(t/tEnd)*(R-L), Y=y=>B-y*(B-T);
const d=cv.pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
const area=d+` L${X(tEnd).toFixed(1)} ${B} L${X(0).toFixed(1)} ${B} Z`;
const hx=X(Math.min(h,tEnd)), hy=Y(cv.at(Math.min(h,tEnd)));
const obsX = m.obs<=tEnd ? X(m.obs) : null;
const gl=[0.25,0.5,0.75,1].map(v=>`<line class="grid" x1="${L}" y1="${Y(v)}" x2="${R}" y2="${Y(v)}"/>`).join("");
const tk=Array.from({length:7},(_,i)=>{ const t=tEnd*i/6;
return `<text class="al" x="${X(t).toFixed(1)}" y="${B+14}" text-anchor="middle">${t<10?t.toFixed(t<1?1:0):Math.round(t)}</text>`;}).join("");
return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de concentration estimée">
${gl}<path d="${area}" fill="var(--accent)" opacity=".16"/>
<path d="${d}" fill="none" stroke="var(--accent2)" stroke-width="2.2"/>
<line class="ax" x1="${L}" y1="${B}" x2="${R}" y2="${B}"/><line class="ax" x1="${L}" y1="${B}" x2="${L}" y2="${T}"/>
${obsX?`<line x1="${obsX}" y1="${T}" x2="${obsX}" y2="${B}" stroke="var(--g2)" stroke-width="1.4" stroke-dasharray="4 3"/>
<text class="al" x="${Math.min(obsX+4,R-54)}" y="${T+9}" fill="var(--g2)" style="fill:var(--g2)">surveillance</text>`:""}
<line class="guide" x1="${hx}" y1="${hy}" x2="${hx}" y2="${B}"/>
<circle cx="${hx}" cy="${hy}" r="5.5" fill="var(--g4)" stroke="var(--card)" stroke-width="2"/>
<text class="pl" x="${hx>R-70?hx-8:hx+9}" y="${Math.max(hy-9,T+10)}" text-anchor="${hx>R-70?"end":"start"}" fill="var(--g4)" style="fill:var(--g4)">patient</text>
${tk}<text class="al" x="${L}" y="${B+30}">heures depuis l'ingestion</text>
<text class="al" x="${L-6}" y="${Y(1)+3}" text-anchor="end">pic</text></svg>`;
}

function plotTx(sc,best){
const W=400,H=300,L=34,R=370,T=18,B=270;
const X=v=>L+(v+1)/2*(R-L), Y=v=>B-(v+1)/2*(B-T);
const any=onSig.size>0;
const pts = DB.txplot.map(nd=>{
const [x,y]=nd.pos, cx=X(x), cy=Y(y);
const isB = nd.k.includes(best);
const act = !any || nd.k.some(k=>sc[k]>0);
const op  = isB?1:act?.9:.25;
const r   = (nd.k.length===2 ? (isB?12:10) : (isB?8:6));
let dot;
if(nd.k.length===2){                                   // point bicolore
const c1=TX[nd.k[0]].coul, c2=TX[nd.k[1]].coul;
dot = `<path d="M${cx} ${cy-r} A${r} ${r} 0 0 0 ${cx} ${cy+r} Z" fill="${c1}"/>`
+ `<path d="M${cx} ${cy-r} A${r} ${r} 0 0 1 ${cx} ${cy+r} Z" fill="${c2}"/>`
+ `<line x1="${cx}" y1="${cy-r}" x2="${cx}" y2="${cy+r}" stroke="var(--card)" stroke-width="1.6"/>`;
} else dot = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${TX[nd.k[0]].coul}"/>`;
const ring = isB ? `<circle cx="${cx}" cy="${cy}" r="${r+6}" fill="none" stroke="${TX[best].coul}" stroke-width="2"/>` : "";
let labs;
if(nd.anc==="side"){
labs = nd.k.map((k,i)=>`<text class="pl" x="${cx+r+6}" y="${cy+4+i*12}" text-anchor="start"
fill="${TX[k].coul}" style="fill:${TX[k].coul}">${esc(nm(k))}</text>`).join("");
} else {
const rr = isB ? r+6 : r;
const base = nd.dy==="below" ? cy+rr+14 : cy-rr-9;
labs = nd.k.map((k,i)=>`<text class="pl" x="${cx}" y="${base+i*12}" text-anchor="${nd.anc}"
fill="${TX[k].coul}" style="fill:${TX[k].coul}">${esc(nm(k))}</text>`).join("");
}
return `<g opacity="${op}">${ring}${dot}${labs}</g>`;
}).join("");
const grid=[-.5,.5].map(v=>`<line class="grid" x1="${X(v)}" y1="${T}" x2="${X(v)}" y2="${B}"/><line class="grid" x1="${L}" y1="${Y(v)}" x2="${R}" y2="${Y(v)}"/>`).join("");
return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagramme des toxidromes">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="var(--ink)" style="fill:var(--ink)"/></marker></defs>${grid}
<line class="ax" x1="${L-6}" y1="${Y(0)}" x2="${R+8}" y2="${Y(0)}" marker-end="url(#ar)" marker-start="url(#ar)"/>
<line class="ax" x1="${X(0)}" y1="${B+6}" x2="${X(0)}" y2="${T-8}" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text class="al" x="${L}" y="${Y(0)+14}">HUMIDE</text><text class="al" x="${R}" y="${Y(0)+14}" text-anchor="end">SEC</text>
<text class="al" x="${X(0)+6}" y="${T+2}">CONSTANTES ↑ · AGITÉ</text>
<text class="al" x="${X(0)+6}" y="${B}">CONSTANTES ↓ · CALME</text>${pts}</svg>`;
}

let IDX=null;
function buildIndex(){
const ix=[];
DB.meds.forEach(m=>ix.push({t:m.n,s:"Médicament · "+m.c,
b:[m.n,(m.syn||[]).join(" "),m.c,m.sg,m.cle,m.anti,m.t12,m.tmax].join(" "),go:()=>showMed(encodeURIComponent(m.n))}));
DB.fiches.forEach(f=>ix.push({t:f.t,s:"Fiche · "+f.cat,
b:[f.t,f.meca,f.delai,f.signes.join(" "),f.pec.join(" "),f.ex,f.cle].join(" "),go:()=>showFiche(f.id)}));
DB.contextes.forEach(c=>c.items.forEach(it=>ix.push({t:it.a,s:"Environnement · "+c.cat,
b:[it.a,it.s,it.t,it.nt].join(" "),
go:()=> it.f&&FICHE[it.f] ? showFiche(it.f) : sheet(`<h3>${esc(it.a)}</h3>
<p class="sm muted" style="margin:5px 0 12px">${esc(c.cat)}</p>
<div class="card"><div class="lbl">Signes</div><p class="sm">${esc(it.s)}</p></div>
<div class="card"><div class="lbl">Conduite</div><p class="sm">${esc(it.t)}</p></div>
${it.nt?`<div class="card"><div class="lbl">Note</div><p class="sm">${esc(it.nt)}</p></div>`:""}${srcLinks(it.src)}`)})));
DB.antidotes.forEach(g=>g.items.forEach(a=>ix.push({t:a.tox+" → "+a.ant,s:"Antidote · "+g.g,
b:[a.tox,a.ant,a.ind.join(" "),a.c,a.nt].join(" "),go:()=>showAnt(a)})));
DB.epurtox.forEach(g=>g.items.forEach(it=>ix.push({t:it.n+" → "+it.tech,s:"Épuration · "+g.titre,
b:[it.n,it.tech,it.ind.join(" "),it.nt,g.p].join(" "),
go:()=>{go("antidotes"); setTimeout(()=>document.getElementById("ep-"+g.tech).scrollIntoView({behavior:"smooth"}),80);}})));
Object.keys(TX).forEach(k=>ix.push({t:TX[k].nom,s:"Toxidrome",
b:[TX[k].nom,TX[k].f.join(" "),TX[k].cle,TX[k].anti].join(" "),
go:()=>sheet(`<h3>${esc(TX[k].nom)}</h3><p class="sm muted" style="margin:5px 0 12px">Toxidrome</p>
<div class="card"><table class="kv">${ROWS.map((r,i)=>`<tr><th>${r}</th><td>${esc(TX[k].f[i])}</td></tr>`).join("")}</table></div>
<div class="card"><div class="lbl">Point clé</div><p class="sm">${esc(TX[k].cle)}</p>
<div class="hr"></div><div class="lbl">Conduite</div><p class="sm">${esc(TX[k].anti)}</p></div>`)}));
DB.sources.forEach(s=>ix.push({t:s.t,s:"Source · "+s.c,b:[s.t,s.a,s.n,s.y].join(" "),go:()=>showSrc(s.id)}));
ix.forEach(x=>x._b=norm(x.b));
return ix;
}
function renderRecherche(){
$("#s-recherche").innerHTML = `
<h2 class="pt">Recherche</h2>
<p class="ps">Dans les médicaments, fiches, environnements, antidotes, épuration, toxidromes, recommandations et sources.</p>
<div class="card"><input id="qq" placeholder="atropine, QRS large, myosis, ECMO, 3MMC…" autocomplete="off"></div>
<div id="qres"><div class="card empty">Saisissez au moins deux caractères.</div></div>`;
$("#qq").oninput=()=>{
if(!IDX) IDX=buildIndex();
const raw=$("#qq").value.trim(), q=norm(raw);
if(q.length<2){ $("#qres").innerHTML=`<div class="card empty">Saisissez au moins deux caractères.</div>`; return; }
const hits=IDX.map(x=>{ const i=x._b.indexOf(q); return i<0?null:{x,sc:(norm(x.t).includes(q)?0:1000)+i}; })
.filter(Boolean).sort((a,b)=>a.sc-b.sc).slice(0,60);
if(!hits.length){ $("#qres").innerHTML=`<div class="card empty">Aucun résultat pour « ${esc(raw)} ».</div>`; return; }
$("#qres").innerHTML=`<p class="xs muted" style="margin-bottom:8px">${hits.length} résultat${hits.length>1?"s":""}</p><div class="card pad0">`+
hits.map((h,i)=>{ const x=h.x, j=x._b.indexOf(q), ctx=x.b.slice(Math.max(0,j-42),j+90).trim();
return `<button class="med" data-k="${i}"><div style="min-width:0">
<div class="mn">${esc(x.t)}</div><div class="mc">${esc(x.s)}</div>
<div class="xs muted" style="margin-top:3px">…${hl(ctx,raw)}…</div></div><span class="ma">›</span></button>`;}).join("")+`</div>`;
$("#qres").querySelectorAll(".med").forEach((b,i)=> b.onclick=()=>hits[i].x.go());
};
}
function hl(txt,q){
const n=norm(txt), i=n.indexOf(norm(q));
if(i<0) return esc(txt);
return esc(txt.slice(0,i))+"<mark>"+esc(txt.slice(i,i+q.length))+"</mark>"+esc(txt.slice(i+q.length));
}
