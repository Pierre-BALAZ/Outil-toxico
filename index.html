<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071226">
<title>Aide Toxico</title>
<style>
:root{
--bg:#071226; --bg2:#050D1C; --card:#0B1A31; --card2:#0E2140; --line:#17304F;
--ink:#E7EFFA; --ink2:#FFFFFF; --muted:#8CA4C4;
--accent:#4D9BE6; --accent2:#89D6FF; --deep:#194294; --sand:#FFEDC6; --water:#6EB0D9;
--g1:#49BE7C; --g2:#EDB64B; --g3:#F08A4B; --g4:#EF5F62;
--sero:#F0894A; --adren:#E3B54C; --anticho:#EF5F62; --aoste:#A982E8;
--cholin:#5FC46E; --hypno:#5B9BE8; --opio:#89D6FF;
--r:16px; --nav:60px;
}
:root[data-theme="light"]{
--bg:#F3F5F9; --bg2:#E9EDF4; --card:#FFFFFF; --card2:#F6F8FC; --line:#D9E1EC;
--ink:#0C1B2E; --ink2:#071226; --muted:#5A6B82;
--accent:#1B5FA8; --accent2:#2E86C9; --deep:#194294;
--g1:#2E7D45; --g2:#B57F10; --g3:#C9601F; --g4:#C62B2E;
--sero:#D4661F; --adren:#A8780F; --anticho:#C62B2E; --aoste:#6C45B0;
--cholin:#2E7D32; --hypno:#1B5FA8; --opio:#2B6FD1;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
background:var(--bg);color:var(--ink);line-height:1.45;-webkit-tap-highlight-color:transparent;
padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
header{background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;
padding:9px 14px;display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);
display:grid;place-items:center;flex:none}
.brand{font-weight:800;letter-spacing:.02em;font-size:1rem;line-height:1.15;color:var(--ink2)}
.brand small{display:block;font-size:.65rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.hbtns{margin-left:auto;display:flex;gap:6px}
.ibtn{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;
width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:17px;height:17px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg2);
border-top:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none;
padding-bottom:env(safe-area-inset-bottom)}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:66px;border:0;background:none;color:var(--muted);
font:inherit;font-size:.61rem;font-weight:700;padding:6px 4px 7px;cursor:pointer;
display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2.5px solid transparent}
nav button svg{width:18px;height:18px}
nav button.on{color:var(--accent2);border-top-color:var(--accent2)}
main{max-width:1180px;margin:0 auto;padding:14px}
section{display:none} section.on{display:block}
h2.pt{font-size:1.28rem;font-weight:800;margin-bottom:3px;letter-spacing:-.01em;color:var(--ink2)}
p.ps{font-size:.85rem;color:var(--muted);margin-bottom:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:11px}
.card.pad0{padding:0;overflow:hidden}
.lbl{font-size:.67rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted);margin-bottom:7px}
.muted{color:var(--muted)} .sm{font-size:.85rem} .xs{font-size:.76rem}
.quad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;
aspect-ratio:1/1;max-width:560px;margin:0 auto 16px}
.qbtn{background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;
color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:10px;padding:14px;text-align:center;position:relative;overflow:hidden;
transition:border-color .15s,transform .1s}
.qbtn:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,
color-mix(in srgb,var(--qc) 26%,transparent),transparent 72%);pointer-events:none}
.qbtn:active{transform:scale(.98)}
.qbtn:hover{border-color:var(--qc)}
.qbtn svg{width:46px;height:46px;color:var(--qc);position:relative;z-index:1}
.qbtn .qn{font-weight:800;font-size:.95rem;line-height:1.25;position:relative;z-index:1;color:var(--ink2)}
.qbtn .qd{font-size:.71rem;color:var(--muted);line-height:1.3;position:relative;z-index:1}
@media(max-width:400px){.qbtn svg{width:36px;height:36px}.qbtn .qn{font-size:.85rem}.qbtn .qd{display:none}}
.srow{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.sbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 11px;
cursor:pointer;font:inherit;color:var(--ink);text-align:left;display:flex;align-items:center;gap:9px;font-size:.84rem;font-weight:700}
.sbtn svg{width:16px;height:16px;color:var(--accent);flex:none}
.sbtn:active{transform:scale(.98)}
label.fl{display:block;font-size:.69rem;font-weight:800;color:var(--muted);margin-bottom:5px;
text-transform:uppercase;letter-spacing:.06em}
input,select{font:inherit;color:var(--ink);background:var(--card2);
border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent2);height:30px}
input::placeholder{color:var(--muted);opacity:.75}
.grid3{display:grid;grid-template-columns:1fr 1fr .85fr;gap:9px}
.row{display:flex;gap:8px;align-items:center}
.b{font:inherit;display:inline-block;text-align:center;font-weight:700;font-size:.84rem;border:1.5px solid var(--line);
background:var(--card2);color:var(--ink);border-radius:10px;padding:9px 13px;cursor:pointer;white-space:nowrap}
.b.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.b.gho{background:none;border-style:dashed;color:var(--accent2);border-color:var(--accent)}
.b:active{transform:scale(.97)}
.sw{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:.8rem;font-weight:700;user-select:none}
.sw input{display:none}
.sw i{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .18s;flex:none}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
background:var(--muted);transition:transform .18s,background .18s}
.sw input:checked + i{background:color-mix(in srgb,var(--g3) 55%,transparent)}
.sw input:checked + i:after{transform:translateX(16px);background:var(--g3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card2);border-radius:10px;padding:7px 10px;
font-size:.85rem;font-weight:650;user-select:none;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pup{border-radius:50%;border:2px solid currentColor;background:#fff;display:inline-flex;
align-items:center;justify-content:center;flex:none}
.pup i{display:block;border-radius:50%;background:#000}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gauge{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.gauge .gt{font-size:.63rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted)}
.gauge .gv{font-size:.98rem;font-weight:800;margin:3px 0 7px;line-height:1.2}
.bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s,background .3s}
.ticks{display:flex;justify-content:space-between;font-size:.59rem;color:var(--muted);margin-top:4px;font-weight:700}
.alertbox{border-radius:12px;padding:10px 12px;margin-bottom:10px;border-left:5px solid;font-size:.86rem}
.a0{background:color-mix(in srgb,var(--g1) 13%,transparent);border-color:var(--g1)}
.a1{background:color-mix(in srgb,var(--g2) 15%,transparent);border-color:var(--g2)}
.a2{background:color-mix(in srgb,var(--g3) 15%,transparent);border-color:var(--g3)}
.a3{background:color-mix(in srgb,var(--g4) 15%,transparent);border-color:var(--g4)}
.ai{background:color-mix(in srgb,var(--accent) 13%,transparent);border-color:var(--accent)}
.alertbox b{display:block;font-size:.92rem;margin-bottom:2px;color:var(--ink2)}
.kv{width:100%;border-collapse:collapse;font-size:.85rem}
.kv th{text-align:left;color:var(--muted);font-weight:650;padding:6px 10px 6px 0;vertical-align:top;
width:36%;border-top:1px solid var(--line);font-size:.79rem}
.kv td{padding:6px 0;border-top:1px solid var(--line);font-weight:600}
.kv tr:first-child th,.kv tr:first-child td{border-top:0}
ul.li{list-style:none;font-size:.86rem}
ul.li li{padding:4px 0 4px 15px;position:relative}
ul.li li:before{content:"";position:absolute;left:2px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.acc{border:1px solid var(--line);border-radius:13px;margin-bottom:8px;background:var(--card);overflow:hidden}
.acc>summary{padding:12px 14px;font-weight:750;cursor:pointer;list-style:none;display:flex;
align-items:center;gap:9px;font-size:.93rem}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .cic{display:grid;place-items:center;color:var(--accent2);flex:none}
.acc>summary .cic svg{width:18px;height:18px}
.acc>summary:after{content:"›";margin-left:auto;font-size:1.3rem;color:var(--muted);transition:transform .2s;line-height:1}
.acc[open]>summary:after{transform:rotate(90deg)}
.acc .inn{padding:0 14px 13px}
.tag{display:inline-block;font-size:.65rem;font-weight:800;padding:2px 7px;border-radius:999px;
background:var(--card2);border:1px solid var(--line);color:var(--muted);margin:0 4px 4px 0}
.tag.red{background:color-mix(in srgb,var(--g4) 18%,transparent);border-color:transparent;color:var(--g4)}
.tag.grn{background:color-mix(in srgb,var(--g1) 18%,transparent);border-color:transparent;color:var(--g1)}
.tag.amb{background:color-mix(in srgb,var(--g2) 20%,transparent);border-color:transparent;color:var(--g2)}
.tag.blu{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:transparent;color:var(--accent2)}
.tag.lp{background:color-mix(in srgb,var(--g3) 20%,transparent);border-color:transparent;color:var(--g3)}
.ep{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;font-weight:800;padding:3px 8px;
border-radius:999px;margin:0 4px 4px 0;border:1px solid}
.ep svg{width:12px;height:12px}
.ep.EER{color:#EDB64B;border-color:color-mix(in srgb,#EDB64B 45%,transparent);background:color-mix(in srgb,#EDB64B 13%,transparent)}
.ep.ECMO{color:#E87BC0;border-color:color-mix(in srgb,#E87BC0 45%,transparent);background:color-mix(in srgb,#E87BC0 13%,transparent)}
.ep.MARS{color:#5BA8E8;border-color:color-mix(in srgb,#5BA8E8 45%,transparent);background:color-mix(in srgb,#5BA8E8 13%,transparent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;
cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.tile:active{transform:scale(.98)}
.tile .tn{font-weight:750;font-size:.89rem;color:var(--ink2)}
.tile .td{font-size:.73rem;color:var(--muted);margin-top:3px;line-height:1.35}
.med{border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;
padding:11px 14px;cursor:pointer;font:inherit;color:var(--ink);display:flex;align-items:center;gap:10px}
.med:last-child{border-bottom:0}
.med:active{background:var(--card2)}
.med .mn{font-weight:720;font-size:.91rem;color:var(--ink2)}
.med .mc{font-size:.73rem;color:var(--muted);margin-top:1px}
.med .ma{margin-left:auto;color:var(--muted);font-size:1.1rem}
.ta{display:grid;grid-template-columns:1fr 26px 1fr;gap:8px;align-items:center;
padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer;background:none;
border-left:0;border-right:0;border-top:0;width:100%;font:inherit;color:var(--ink);text-align:left}
.ta:last-child{border-bottom:0}
.ta:active{background:var(--card2)}
.ta .tox{font-weight:750;font-size:.87rem;color:var(--ink2)}
.ta .arr{color:var(--accent2);text-align:center;font-size:1.1rem;font-weight:700}
.ta .ant{font-weight:700;font-size:.87rem;color:var(--accent2)}
.ta .ep{margin-top:3px}
@media(max-width:560px){.ta{grid-template-columns:1fr;gap:3px}.ta .arr{text-align:left;font-size:.95rem}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;
align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;width:100%;max-width:720px;
max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 15px calc(26px + env(safe-area-inset-bottom))}
.sheet h3{font-size:1.16rem;font-weight:800;color:var(--ink2)}
.shclose{position:sticky;top:0;float:right;background:var(--card2);border:1px solid var(--line);
width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--ink);z-index:2;font-size:.95rem}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px;max-height:84vh;border-bottom:1px solid var(--line)}}
svg.plot{width:100%;height:auto;display:block}
.plot .ax{stroke:var(--ink);stroke-width:1.4;opacity:.75}
.plot .grid{stroke:var(--line);stroke-width:1}
.plot text{font-family:inherit;fill:var(--ink)}
.plot .al{font-size:10px;fill:var(--muted);font-weight:700;letter-spacing:.04em}
.plot .pl{font-size:10px;font-weight:800}
.plot .guide{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;opacity:.5}
.capt{font-size:.73rem;color:var(--muted);text-align:center;margin-top:5px;font-weight:600;line-height:1.5}
.frise{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:4px}
.fb{border-top:4px solid var(--fc);background:var(--card2);border-radius:0 0 10px 10px;padding:8px 9px 10px;
display:flex;flex-direction:column;gap:7px}
.fb .fh{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--fc)}
.fb .fm b{display:block;font-size:.84rem;color:var(--ink2);font-weight:800}
.fb .fm span{display:block;font-size:.74rem;color:var(--muted)}
.fb .fm em{display:block;font-size:.7rem;color:var(--muted);font-style:italic;margin-top:2px;line-height:1.35}
@media(max-width:620px){
.frise{grid-template-columns:1fr;gap:0}
.fb{border-top:0;border-left:4px solid var(--fc);border-radius:0 10px 10px 0;margin-bottom:6px}
}
figure.ph{margin:10px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card2);max-width:380px}
figure.ph img{width:100%;height:auto;max-height:300px;object-fit:contain;display:block;cursor:zoom-in;background:#000}
figure.ph figcaption{font-size:.72rem;color:var(--muted);padding:7px 9px;line-height:1.45}
figure.ph figcaption span.cr{display:block;margin-top:2px;font-style:italic;opacity:.85;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.phfull{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:none;
align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.phfull.on{display:flex}
.phfull img{max-width:100%;max-height:92vh;object-fit:contain;border-radius:8px}
a.vg{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);
border-radius:11px;padding:10px 12px;margin-bottom:10px;text-decoration:none;color:var(--accent2);
font-weight:750;font-size:.85rem}
a.vg svg{width:15px;height:15px;flex:none}
a.vg span{margin-left:auto;font-size:1.1rem;color:var(--muted)}
a.vg:active{transform:scale(.99)}
.catnote{background:color-mix(in srgb,var(--accent) 11%,transparent);border-left:4px solid var(--accent);
border-radius:9px;padding:9px 11px;font-size:.8rem;margin-bottom:10px;line-height:1.5}
.disc{font-size:.71rem;color:var(--muted);text-align:center;margin:14px 0 4px;line-height:1.55}
.srcref{color:var(--accent2)}
.hr{height:1px;background:var(--line);margin:11px 0}
mark{background:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--ink2);padding:0 2px;border-radius:3px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:.9rem}
.mole{border:1px solid var(--line);border-radius:13px;background:var(--card2);padding:11px;margin-bottom:9px}
.mole .mh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.mole .mh .nm{font-weight:800;font-size:.93rem;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mole .mh button{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.05rem;padding:2px 5px}
@media(min-width:880px){ .calcwrap{display:grid;grid-template-columns:1fr 1.05fr;gap:14px;align-items:start}
.tx{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start} }
</style>
</head>
<body>
<header>
<div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px">
<path d="M12 2.5 4 6v6c0 4.4 3.3 8.3 8 9.5 4.7-1.2 8-5.1 8-9.5V6l-8-3.5Z"/><path d="M12 8v7M8.5 11.5h7"/></svg></div>
<div class="brand">AIDE TOXICO<small>SMUR BMPM · hors-ligne</small></div>
<div class="hbtns">
<button class="ibtn" id="btheme" title="Thème"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17" /><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
<button class="ibtn" id="bsearch" title="Recherche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
</div>
</header>
<main>
<section id="s-accueil" class="on"></section>
<section id="s-calcul"></section>
<section id="s-toxidromes"></section>
<section id="s-contexte"></section>
<section id="s-antidotes"></section>
<section id="s-meds"></section>
<section id="s-fiches"></section>
<section id="s-rfe"></section>
<section id="s-recherche"></section>
<section id="s-sources"></section>
<p class="disc">Aide cognitive destinée aux professionnels de santé. Ne se substitue pas au jugement clinique
ni à l'avis du centre antipoison.</p>
</main>
<nav id="nav"></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

épines pour les convulsions, kétamine pour l'induction à séquence rapide"],"ex":"Industriels : dichlorvos, malathion, parathion · Vapeur (agents G) : sarin, soman, tabun · Liquide (agents V) : VX/VR, novichok","det":"AP4C / S4PE : voyant « P », plus « S » pour VX/VR · PDF1 : jaune (agents G), vert foncé (agents V)","epi":"ARF avec cartouche · Tenue type 3 · Gants butyle · Surbottes","tri":"TRI T1","cle":"Agent contaminant : la protection du personnel passe avant la prise en charge. L'atropine n'a pas de dose maximale, la cible est l'assèchement bronchique.","src":["info-bmpm","rfe-t4"],"frise":false},{"id":"vesicants","t":"Vésicants","cat":"NRBC","meca":"Atteintes cellulaires multiples, effets radiomimétiques. Lewisite : effet vésicant et toxicité générale de l'arsenic.","delai":"Différé (plusieurs heures). Ypérite : immédiat pour l'œil, retardé jusqu'à 48 h pour la peau","signes":["Conscience : normale","Œil : inflammation, pupille normale","Respiration : irritation","Peau : rougeurs, bulles, œdème. Lewisite : auréole grise","Sécrétions : normales"],"pec":["Décontamination gant poudreur + RSDL","Ypérite : traitement symptomatique (O₂ + β2), lavage des yeux","Lewisite : B.A.L. (dimercaprol) — adulte 1 ampoule IM puis toutes les 4 h ; enfant 2–3 mg/kg (max 200 mg)","Lewisite : DMSA 10 mg/kg toutes les 8 h pendant 5 jours"],"ex":"Ypérite (gaz moutarde) · Lewisite","det":"AP4C / S4PE : voyant « HNO » ou « S » (ypérite), « As » (lewisite) · PDF1 : rouge","epi":"ARF avec cartouche · Tenue type 3 · Gants butyle · Surbottes","tri":"TRI T2","cle":"Ypérite : effet radiomimétique différé, considérer le patient comme un brûlé immunodéprimé.","src":["info-bmpm"],"frise":false},{"id":"suffocants","t":"Suffocants","cat":"NRBC","meca":"Lésions de contact directes des voies aériennes supérieures jusqu'à la membrane alvéolocapillaire, selon le type de suffocant.","delai":"Immédiat si intoxication massive, différé possible. L'OAP peut être retardé de 12 à 24 h (jusqu'à 72 h pour la phosphine)","signes":["Conscience : normale","Œil : inflammation, pupille normale","Respiration : polypnée","Peau : cyanose","Sécrétions : hémoptysie","Autres : douleur thoracique, céphalées, vomissements"],"pec":["Déshabillage, douche si contact massif","Extraction immédiate, patient assis, O₂ > 10 L/min","Traitement symptomatique : O₂, β2, corticoïdes, intubation si besoin","Lavage oculaire 15 min si symptômes","OAP : ventilation en pression positive continue","Phosphine : réduction du débit d'O₂, β2, corticoïdes si composante spastique ; hémodialyse si insuffisance rénale"],"ex":"Chlore · Phosphine · Ammoniac · Isocyanate de méthyle · Phosgène","det":"Chlore : détection spécifique · Phosphine : AP4C (S4PE), voyant « P »","epi":"ARF avec cartouche · Tenue type 3 · Gants butyle · Surbottes","tri":"TRI T1 si défaillance respiratoire","cle":"Intervalle libre trompeur de 2 à 24 h : tout patient exposé doit être surveillé en milieu hospitalier à cause du risque d'OAP lésionnel retardé.","src":["info-bmpm","sfmu-suffocants"],"frise":false},{"id":"cyanures","t":"Cyanés","cat":"NRBC","meca":"Toxicité cellulaire par inhibition mitochondriale (cytochrome c oxydase).","delai":"Très rapide (quelques minutes)","signes":["Conscience : coma","Œil : mydriase","Respiration : polypnée","Peau : rose puis cyanose","Sécrétions : normales","Autres : collapsus cardiovasculaire, hyperlactatémie"],"pec":["Déshabillage","O₂ 15 L/min, même si SaO₂ normale","Hydroxocobalamine (CYANOKIT) — adulte : 5 g IV en 15 min ; enfant : 70 mg/kg IV (max 5 g) en 15 min","Renouvelable une fois"],"ex":"Inhalation (fumées d'incendie), passage transcutané, ingestion","det":"Aucune détection directe","epi":"ARF avec cartouche · Tenue type 3 · Gants butyle · Surbottes","tri":"TRI T1","cle":"Dans les fumées d'incendie, l'association cyanure + monoxyde de carbone est la règle. Un lactate ≥ 8 mmol/L chez une victime d'incendie oriente fortement vers le cyanure.","src":["info-bmpm"],"frise":false},{"id":"opioides-n : coma hypotonique, risque d'inhalation","Convulsions, bradycardie sinusale, bloc auriculoventriculaire, ondes U (RFE)"],"pec":["Position latérale de sécurité, protection des voies aériennes","Ventilation si besoin","Ne pas se précipiter sur l'intubation en séquence rapide : récupération souvent rapide","Bilan : CPK, ECG (RFE Tableau 5)"],"ex":"« G », liquid ecstasy (aucun rapport avec l'ecstasy). GBL et BD : effets similaires, durée d'action bien plus longue","det":"","epi":"","tri":"","cle":"Récupération en moins d'une heure pour le GHB : réveil brutal et complet typique. Antidote : aucun.","src":["info-bmpm","rfe-t5"],"frise":false},{"id":"mdma","t":"Ecstasy / MDMA","cat":"Drogues","meca":"Libération massive de sérotonine et de catécholamines.","delai":"30 min, durée 2–3 h","signes":["Mâchoire crispée, trouble urinaire, vertiges, bouche sèche","Mode d'aggravation : hyperthermie, insuffisance rénale et hépatique","Arrêt cardiaque (fibrillation ventriculaire, trouble du rythme)","Hyponatrémie (potomanie associée)"],"pec":["Benzodiazépines","Refroidissement actif","Attention à l'hyponatrémie : ionogramme systématique","Bilan : ionogramme, urée-créatinine, CPK, troponine, gazométrie, ECG (RFE Tableau 5)"],"ex":"« X », XTC, Molly, MD","det":"","epi":"","tri":"","cle":"L'hyponatrémie de dilution (consommation massive d'eau en milieu festif) est une cause classique de convulsions, indépendante de l'hyperthermie.","src":["info-bmpm","rfe-t5"],"frise":false},{"id":"keta","t":"Kétamine / MXE / PCP","cat":"Drogues","meca":"Antagonisme des récepteurs NMDA : effet dissociatif.","delai":"Quelques minutes, durée 40 min – 4 h","signes":["Dissociation, hallucinations, panique, sensation de paralysie","Kétamine : overdoses très rares ; toxicité chronique rénale et urinaire","MXE : arrêt respiratoire","Dépression respiratoire (RFE)"],"pec":["Réassurance en milieu calme","Benzodiazépines si agitation","Bilan : ionogramme, urée-créatinine, CPK, transaminases, TP (RFE Tableau 5)"],"ex":"« K », Special K, drogue à poney/cheval, Mesket (MXE), Angeldust (PCP)","det":"","epi":"","tri":"","cle":"Rechercher rhabdomyolyse, insuffisance rénale, hyponatrémie et insuffisance hépatocellulaire. Antidote : aucun.","src":["info-bmpm","rfe-t5"],"frise":false},{"id":"cannabinoides","t":"Cannabinoïdes de synthèse","cat":"Drogues","meca":"Agonisme complet des récepteurs CB1, très supérieur au cannabis naturel.","delai":"Très variable : quelques minutes à quelques heures","signes":["Troubles psychiatriques (paranoïa…), convulsions, coma, troubles du rythme","Mode d'aggravation : troubles du rythme cardiaque et/ou équivalent d'infarctus","Encéphalopathie et agitation extrême conduisant à une mise en danger du patient (RFE)"],"pec":["Benzodiazépines","Surveillance scopée","Bilan : ionogramme, urée-créatinine, CPK, troponine, ECG (RFE Tableau 5)"],"ex":"Spleen, PTC, Buddha Blue, K2, Spice, HHC, HHCO, HHCP, THCP, THCPO, PINACA, CP-47, 497-C8, JWH-018, HU-201, AM-630, UR-144","det":"","epi":"","tri":"","cle":"Très différents du cannabis classique : risque cardiaque et convulsif réel. Antidote : aucun.","src":["info-bmpm","rfe-t5"],"frise":false},{"id":"nps-autres","t":"Autres molécules et mélanges","cat":"Drogues","meca":"Nouvelles substances psychoactives (NPS) et associations.","delai":"Variable","signes":["Pipérazine : effets de « super ecstasy » (mCCP/BZP/TFMPP…)","Nitazènes : effet de « super opiacés » (naloxone +++)","Méthamphétamines : « crank », « crystal », « ice » et amphétamines","Nouvelles benzodiazépines (diclazépam, deschloroétizolam)","NBOMe : « super LSD », effets type cathinones","Prégabaline (Lyrica)","Champignons hallucinogènes (psilocybine)"],"pec":["Prise en charge symptomatique selon le toxidrome dominant","Identification analytique dans le cadre d'un réseau d'alerte (RFE R7.2.2), pas en routine"],"ex":"Mélanges : « speed ball » (cocaïne + héroïne, ou amphétamines + fentanyl) · cigarettes de cannabis trempées dans la cocaïne (spécialité locale) · cocaïne + alcool (cocaéthylène) · opiacés + PCP ou benzodiazépines (risque respiratoire +++)","det":"","epi":"","tri":"","cle":"Chemsex : stimulation psycho + sexuelle + désinhibition. Association fréquente de stimulants (souvent cathinones) + psychodysleptiques (souvent kétamine) + dépresseurs (souvent GHB) + viagra/poppers, dans un ordre précis. En pré-hospitalier, les interventions sont souvent liées au surdosage en GHB.","src":["info-bmpm","rfe-nps"],"frise":false},{"id":"poppers","t":"Poppers","cat":"Drogues","meca":"Nitrites volatils : vasodilatation et oxydation de l'hémoglobine en méthémoglobine.","delai":"Quelques secondes, durée quelques minutes","signes":["Céphalées, flush, hypotension","Collapsus cardiorespiratoire (RFE)","Méthémoglobinémie : cyanose grise réfractaire à l'oxygène, SpO₂ bloquée vers 85 %"],"pec":["O₂","Bleu de méthylène 1–2 mg/kg si méthémoglobinémie > 20 % ou signes d'hypoxie tissulaire (RFE Tableau 4)","Bilan : méthémoglobinémie, gazométrie, lactatémie (RFE Tableau 5)"],"ex":"Nitrites d'alkyle inhalés","det":"","epi":"","tri":"","cle":"L'association avec le sildénafil (viagra) expose à un collapsus profond. La saturation en oxygène reste faussement basse et ne remonte pas sous O₂.","src":["info-bmpm","rfe-t4","rfe-t5"],"frise":false},{"id":"protoxyde","t":"Protoxyde d'azote","cat":"Drogues","meca":"Inactivation de la vitamine B12 : carence fonctionnelle avec atteinte neurologique.","delai":"Effet euphorisant immédiat et bref. Atteinte neurologique après usage répété","signes":["Aigu : euphorie, vertiges, asphyxie par hypoxie si inhalation en circuit fermé","Chronique : paresthésies, ataxie, sclérose combinée de la moelle, anémie macrocytaire"],"pec":["Arrêt de l'exposition","Vitamine B12 à fortes doses","Avis neurologique, IRM médullaire","Dosage : homocystéine, acide méthylmalonique (plus sensibles que la B12 sérique)"],"ex":"« Proto », ballons, cartouches de siphon","det":"","epi":"","tri":"","cle":"Consommation en forte hausse chez les jeunes. Le dosage de vitamine B12 peut être normal : doser l'homocystéine.","src":["info-bmpm"],"frise":false},{"id":"qt-long","t":"Médicaments allongeant le QT","cat":"Médicaments","meca":"Blocage du courant potassique rectifiant retardé (IKr, canal hERG) : repolarisation ventriculaire prolongée, susceptible de dégénérer en torsades de pointes puis en fibrillation ventriculaire.","delai":"Immédiat en surdosage aigu · Cumulatif en cas d'association ou d'inhibition enzymatique","signes":["QTc > 500 ms, ou allongement de plus de 60 ms par rapport à l'ECG de référence : risque de torsades","Torsades de pointes : tachycardie ventriculaire polymorphe à torsion de pointe autour de la ligne de base, souvent précédée d'une pause et d'un couplage long-court","Syncopes à l'emporte-pièce, lipothymies, mort subite","Souvent asymptomatique jusqu'à l'accident rythmique : seul l'ECG dépiste"],"pec":["ECG systématique devant toute intoxication par un médicament de cette liste, répété en cas d'association","Mesure du QT corrigé : formule de Bazett peu fiable au-delà de 100/min, préférer Fridericia","Correction immédiate de la kaliémie (cible ≥ 4,5 mmol/L) et de la magnésémie","Sulfate de magnésium 2 g IV lent en cas de torsades, même si la magnésémie est normale","Accélération de la fréquence cardiaque : isoprénaline ou entraînement électrosystolique si torsades bradycardie-dépendantes","Arrêt de tous les médicaments allongeant le QT · scope prolongé","Antiarythmiques de classe Ia et III contre-indiqués (ils aggravent)"],"ex":"Antiarythmiques : sotalol, amiodarone, flécaïnide (effet mixte) · Antipsychotiques : amisulpride +++, halopéridol, chlorpromazine, cyamémazine, quétiapine, rispéridone · Antidépresseurs : citalopram +++, escitalopram +++, trazodone, tricycliques · Antihistaminiques : hydroxyzine, prométhazine · Antiémétiques : dompéridone, ondansétron · Anti-infectieux : macrolides, fluoroquinolones, antifongiques azolés, hydroxychloroquine · Opioïdes : méthadone · Méthadone et amisulpride sont les plus pourvoyeurs de torsades en toxicologie d'urgence","det":"","epi":"","tri":"","cle":"Les facteurs favorisants comptent autant que la molécule : hypokaliémie, hypomagnésémie, hypocalcémie, bradycardie, sexe féminin, âge, cardiopathie, QT long congénital, et surtout l'association de plusieurs molécules. Un QT normal à l'admission ne dispense pas de le recontrôler, en particulier pour l'amisulpride (scope 16 h) et le citalopram (signes rapportés jusqu'à 13 h).","src":["crediblemeds","litfl-amis","aact-ssri","rfe-t6"],"frise":false},{"id":"interactions","t":"Interactions arythmogènes et cytochromes P450","cat":"Médicaments","meca":"Deux mécanismes distincts : l'addition pharmacodynamique d'effets sur la repolarisation ou sur la conduction, et l'augmentation pharmacocinétique des concentrations par inhibition du métabolisme (cytochromes P450, glycoprotéine P).","delai":"L'inhibition enzymatique produit un surdosage relatif en quelques jours, chez un patient dont l'ordonnance n'a pas changé de dose","signes":["Surdosage « sans surdosage » : concentrations toxiques à posologie inchangée après introduction d'un inhibiteur","Addition d'effets sur le QT : deux molécules à risque modéré donnent un risque élevé","Addition d'effets stabilisants de membrane : élargissement du QRS","Syndrome sérotoninergique par association d'agents sérotoninergiques","Bradycardie majeure par association de bradycardisants (bêtabloquant + inhibiteur calcique + digoxine)"],"pec":["Reconstituer l'ordonnance complète, y compris automédication, phytothérapie et produits en vente libre","Devant un tableau toxique chez un patient à posologie stable, chercher le médicament récemment introduit","ECG : QRS et QT corrigé","Ionogramme, fonction rénale et hépatique (une insuffisance d'organe se comporte comme un inhibiteur)","Dosage plasmatique quand il existe : digoxine, lithium, valproate, carbamazépine","Avis pharmacologique ou centre antipoison pour les associations complexes"],"ex":"Inhibiteurs puissants du CYP3A4 : antifongiques azolés (kétoconazole, itraconazole, voriconazole), macrolides (clarithromycine, érythromycine), inhibiteurs de protéase, jus de pamplemousse · Inhibiteurs du CYP2D6 : paroxétine, fluoxétine, bupropion, quinidine · Inhibiteurs du CYP1A2 : fluvoxamine, ciprofloxacine · Inducteurs : carbamazépine, phénytoïne, phénobarbital, rifampicine, millepertuis · Inhibiteurs de la glycoprotéine P : amiodarone, vérapamil, clarithromycine (majorent le dabigatran et la digoxine)","det":"","epi":"","tri":"","cle":"Trois associations à repérer en urgence : clarithromycine ou azolé + statine, antiarythmique ou anticoagulant oral direct (surdosage brutal) ; fluoxétine ou paroxétine + tricyclique ou métoprolol (inhibition du CYP2D6) ; tramadol, linézolide ou millepertuis + ISRS (syndrome sérotoninergique). L'insuffisance rénale ou hépatique se comporte comme un inhibiteur enzymatique permanent.","src":["ansm-bdpm","crediblemeds","rfe-t6"],"frise":false},{"id":"anticoag","t":"Hémorragie sévère et anticoagulants","cat":"Médicaments","meca":"Réversion de l'anticoagulation en situation d'hémorragie grave. Quatre classes, quatre conduites distinctes.","delai":"Urgence immédiate. Pour les AVK, l'INR ne reflète l'ingestion qu'après 24 à 48 h","signes":["Critères d'hémorragie grave : saignement non contrôlé ; instabilité hémodynamique avec PAS < 90 mmHg ou PAM < 65 mmHg ; nécessité de transfusion ou d'un geste hémostatique urgent","Mise en jeu du pronostic vital ou fonctionnel : saignement intracrânien, gastro-intestinal, intraoculaire, intrarachidien"],"pec":["AVK (Coumadine, Previscan) — réversion si INR indisponible, ou si INR > 1,5 (> 1,2 si hémorragie intracrânienne). Vitamine K 10 mg PO ou IV. PPSB 25–50 UI/kg. Pas de contrôle de concentration.","Anti-Xa (Eliquis, Xarelto) — réversion si dosage indisponible, ou si concentration < 50 ng/mL (< 30 si HIC). PPSB 25–50 UI/kg, 50 UI/kg si hémorragie intracrânienne ou choc. Pas de contrôle de concentration. Andexanet alfa : pas d'AMM en France.","Dabigatran (Pradaxa) — réversion si dosage indisponible, ou si concentration < 50 ng/mL (< 30 si HIC). Idarucizumab 5 g IV. PPSB 25–50 UI/kg. Contrôle de la concentration de dabigatran à 12–24 h (4–6 h si insuffisance rénale ou concentration initiale élevée).","HNF et HBPM — sulfate de protamine. 1 mg de protamine neutralise 100 UI d'héparine si l'injection date de moins de 30 min ; sinon 0,5 mg pour 100 UI si l'héparine date de plus de 30 min. La posologie dépend de la voie d'administration et du délai depuis la dernière administration."],"ex":"AVK : Coumadine, Previscan, Sintrom · Anti-Xa : Eliquis (apixaban), Xarelto (rivaroxaban) · Anti-IIa : Pradaxa (dabigatran) · Héparines : HNF, énoxaparine, tinzaparine","det":"","epi":"","tri":"","cle":"Cas particulier de l'AVC ischémique : thrombolyse possible si INR < 1,7 (AVK), ou si concentration d'AOD < 50 ng/mL et discutable entre 50 et 100 ng/mL. Pour le dabigatran, thrombolyse possible après réversion. Ne pas oublier qu'un traitement par anticoagulant ne contre-indique pas une thrombectomie.","src":["info-bmpm-anticoag","sfar-anticoag","rfe-t4"],"frise":false},{"id":"mode-prise","t":"Mode de prise et rapidité d'action","cat":"Drogues","meca":"La voie d'administration détermine la vitesse d'apparition des effets, le pic plasmatique et les complications locales — autant que la molécule elle-même.","delai":"Immédiat (intraveineux) à retardé (oral)","signes":["Slam — prise intraveineuse — effet immédiat. Risque : septicémie, endocardite, lésions locales","Sniff — prise intranasale — effet rapide. Risque : lésions locales du nez, perforation septale","Bang — prise inhalée — effet rapide. Risque : lésions pulmonaires","Skin popping — prise sous-cutanée — effet intermédiaire. Risque : lésions locales, nécroses, infections","Parachute / bombing — prise orale, équivalent d'une libération prolongée — effet retardé. Risque : apparition différée des symptômes"],"pec":["Interroger systématiquement sur la voie de prise : elle oriente le délai de surveillance","Prise orale ou parachute : surveillance prolongée, le pic peut survenir plusieurs heures après l'admission","Prise intraveineuse : rechercher les points d'injection, penser à l'endocardite et aux complications infectieuses","Prise sous-cutanée : rechercher les lésions cutanées nécrotiques caractéristiques"],"ex":"","det":"","epi":"","tri":"","cle":"Une prise orale en parachute se comporte comme une forme à libération prolongée : un patient asymptomatique à l'arrivée peut se dégrader plusieurs heures plus tard. C'est l'erreur de surveillance la plus fréquente.","src":["smurbmpm-drogues"],"frise":true},{"id":"sd-resinoidien","t":"Syndrome résinoïdien","cat":"Champignons","meca":"Irritation digestive directe. De loin le plus fréquent.","delai":"Incubation courte (< 6 h), quelques minutes à rarement plus de 6 h","signes":["Troubles digestifs violents : nausées, vomissements, diarrhées","Déshydratation possible"],"pec":["Traitement symptomatique + hydratation","Anti-diarrhéiques contre-indiqués","Lopéramide proscrit"],"ex":"Clitocybes de l'olivier (confusion avec les girolles), entolomes, bolets","det":"","epi":"","tri":"","cle":"Si d'autres symptômes sont présents, ou si le délai dépasse 6 h, évoquer un autre syndrome. Avis centre antipoison dans tous les cas.","src":["info-bmpm-champi"],"frise":false},{"id":"sd-pantherinien","t":"Syndrome panthérinien","cat":"Champignons","meca":"Effet anticholinergique central (acide iboténique, muscimol).","delai":"30 min à 3 h (symptômes précoces < 6 h). Durée : quelques heures","signes":["Syndrome anticholinergique : agitation, délire, mydriase, hallucinations","Parfois somnolence et coma"],"pec":["Traitement symptomatique +/- sédation","Benzodiazépines si agitation"],"ex":"Amanite panthère, amanite tue-mouche. Confusion avec l'oronge (amanite des Césars)","det":"","epi":"","tri":"","cle":"Évolution habituellement favorable en quelques heures.","src":["info-bmpm-champi"],"frise":false},{"id":"sd-sudorien","t":"Syndrome sudorien (muscarinique)","cat":"Champignons","meca":"Effet cholinergique muscarinique direct (muscarine).","delai":"15 min à 2 h (symptômes précoces < 6 h). Durée : quelques heures","signes":["Syndrome cholinergique : sueurs profuses, hypersalivation, myosis, bradycardie, douleurs abdominales"],"pec":["Traitement symptomatique +/- atropine"],"ex":"Clitocybes (blancs), inocybes","det":"","epi":"","tri":"","cle":"Tableau cholinergique pur, sans atteinte nicotinique : l'atropine est très efficace.","src":["info-bmpm-champi"],"frise":false},{"id":"sd-phalloidien","t":"Syndrome phalloïdien","cat":"Champignons","meca":"Inhibition de l'ARN polymérase II par les amatoxines : nécrose hépatique.","delai":"6 à 24 h (symptômes tardifs > 6 h). Amélioration trompeuse vers 36–48 h, puis cytolyse hépatique (pic à 3–5 jours)","signes":["Phase 1 : syndrome digestif majeur (diarrhées +++), déshydratation","Phase 2 : accalmie trompeuse (36–48 h)","Phase 3 : hépatite, CIVD, insuffisance rénale aiguë, coma hépatique"],"pec":["N-acétylcystéine (Fluimucil) et silibinine (Legalon)","Prise en charge symptomatique, réhydratation massive","Anti-diarrhéiques contre-indiqués","Épuration extra-rénale selon le tableau","Dialyse hépatique (MARS) et avis de transplantation hépatique","Dosage de l'alpha-amanitine possible"],"ex":"Amanites (phalloïde, vireuse, printanière), mais pas que : certaines lépiotes ++ et certaines galères. Confusion avec la rose des prés et les coulemelles","det":"","epi":"","tri":"","cle":"Le syndrome mortel. Tout délai supérieur à 6 h entre le repas et les premiers signes doit le faire évoquer. L'accalmie du 2e jour est trompeuse.","src":["info-bmpm-champi","info-bmpm"],"frise":false},{"id":"sd-gyromitrien","t":"Syndrome gyromitrien","cat":"Champignons","meca":"Gyromitrine : antagonisme de la vitamine B6, hémolyse, cytolyse.","delai":"8 à 24 h (symptômes tardifs > 6 h)","signes":["Syndrome digestif","Puis cytolyse hépatique +/- agitation et convulsions +/- hémolyse"],"pec":["Prise en charge symptomatique","Benzodiazépines si convulsions","Vitamine B6"],"ex":"Gyromitre. Confusion avec les morilles","det":"","epi":"","tri":"","cle":"Les convulsions répondent à la vitamine B6, comme dans l'intoxication par l'isoniazide.","src":["info-bmpm-champi"],"frise":false},{"id":"sd-orellanien","t":"Syndrome orellanien","cat":"Champignons","meca":"Orellanine : néphrotoxicité tubulo-interstitielle.","delai":"12 h à 18 jours (délai le plus long de tous les syndromes)","signes":["Syndrome digestif, cytolyse","Puis atteinte rénale, souvent terminale"],"pec":["Prise en charge symptomatique +/- épuration extra-rénale","Suivi néphrologique prolongé"],"ex":"Cortinaires (orellanus, speciosissimus, orellanoides). Confusion avec les lactaires délicieux","det":"","epi":"","tri":"","cle":"Le délai peut atteindre 18 jours : interroger sur les repas de champignons des trois semaines précédentes devant une insuffisance rénale inexpliquée. L'insuffisance rénale est souvent terminale.","src":["info-bmpm-champi"],"frise":false},{"id":"sd-proximien","t":"Syndrome proximien","cat":"Champignons","meca":"Néphrotoxicité (Amanita proxima).","delai":"8 à 14 h","signes":["Comme le syndrome orellanien : insuffisance rénale aiguë +/- cytolyse"],"pec":["Prise en charge symptomatique","Épuration extra-rénale si besoin"],"ex":"Amanite à volve rousse (Amanita proxima)","det":"","epi":"","tri":"","cle":"Insuffisance rénale toujours régressive, contrairement au syndrome orellanien. Espèce méditerranéenne.","src":["info-bmpm-champi"],"frise":false},{"id":"sd-paxillien","t":"Syndrome paxillien","cat":"Champignons","meca":"Mécanisme immuno-allergique après sensibilisation répétée.","delai":"Rare. Après ingestions répétées","signes":["Troubles digestifs","Voire anémie hémolytique immuno-allergique"],"pec":["Traitement symptomatique","Prise en charge de l'hémolyse"],"ex":"Paxilles enroulés crus ou mal cuits","det":"","epi":"","tri":"","cle":"Rare. Survient chez le consommateur habituel, après sensibilisation.","src":["info-bmpm-champi"],"frise":false},{"id":"sd-coprinien","t":"Syndrome coprinien","cat":"Champignons","meca":"Effet antabuse : inhibition de l'aldéhyde déshydrogénase.","delai":"Très rare. Si prise d'alcool de 1 h à 5 jours après la consommation","signes":["Effet bétamimétique : flush, tachycardie, hypotension, nausées, céphalées"],"pec":["Traitement symptomatique","Éviction de l'alcool pendant 5 jours"],"ex":"Coprin noir d'encre","det":"","epi":"","tri":"","cle":"Le champignon seul est inoffensif : c'est l'alcool consommé jusqu'à 5 jours après qui déclenche les signes.","src":["info-bmpm-champi"],"frise":false}],"fiche_liens":{"Champignons":{"s":"smurbmpm-champi","u":"https://smurbmpm.fr/contenu-pedagogique/les-intoxications-aux-champignons/","t":"Vue globale : champignons"},"Drogues":{"s":"smurbmpm-drogues","u":"https://smurbmpm.fr/contenu-pedagogique/les-drogues/","t":"Vue globale : drogues"},"NRBC":{"s":"smurbmpm-nrbc","u":"https://smurbmpm.fr/toxicologie/nrbc-les-agents-chimiques/","t":"Vue globale : agents chimiques"}},"frise":[{"v":"Immédiat","c":"#EF5F62","m":[{"n":"Slam","s":"Prise intraveineuse","r":"Septicémie, endocardite, lésions locales"}]},{"v":"Rapide","c":"#F08A4B","m":[{"n":"Sniff","s":"Prise intranasale","r":"Lésions locales du nez, perforation septale"},{"n":"Bang","s":"Prise inhalée","r":"Lésions pulmonaires"}]},{"v":"Intermédiaire","c":"#EDB64B","m":[{"n":"Skin popping","s":"Prise sous-cutanée","r":"Lésions locales, nécroses, infections"}]},{"v":"Retardé","c":"#49BE7C","m":[{"n":"Parachute / bombing","s":"Prise orale — équivalent d'une libération prolongée","r":"Apparition différée des symptômes"}]}],"photos":{"nitrite":{"src":"data:image/webp;base64,UklGRmgrAABXRUJQVlA4IFwrAAAQ0gCdASodAaQBPpVGnEslo6kvJfRbWeASiWduiUA9V/z58oJTgA5/Xl+gjSclUtDJnKLuvYCrMAS3kHs8XsHNnhNKsq1O8PfQ79pmf+M2qnbQ/rPC/5F/S3sKXIv2f8EbfP9p6Bfth9v8EjVf8J+wHxBn4L/vewd/Vv9n+ t":"Naloxone","f":"opiaces","nt":"","src":["info-bmpm"],"img":""},{"a":"GHB / GBL","s":"Coma calme, réveil brutal","t":"Protection des voies aériennes","f":"ghb","nt":"","src":["info-bmpm"],"img":""},{"a":"Ecstasy / MDMA","s":"Hyperthermie, hyponatrémie, troubles du rythme","t":"Benzodiazépines, refroidissement, ionogramme","f":"mdma","nt":"","src":["info-bmpm"],"img":""},{"a":"Kétamine / PCP","s":"Dissociation, hallucinations","t":"Réassurance, benzodiazépines","f":"keta","nt":"","src":["info-bmpm"],"img":""},{"a":"Cannabinoïdes de synthèse","s":"Troubles psychiatriques, convulsions, troubles du rythme","t":"Benzodiazépines, scope","f":"cannabinoides","nt":"","src":["info-bmpm"],"img":""},{"a":"Protoxyde d'azote","s":"Atteinte neurologique par carence fonctionnelle en B12","t":"Vitamine B12 à fortes doses","f":"protoxyde","nt":"","src":["info-bmpm"],"img":""},{"a":"Poppers","s":"Méthémoglobinémie, collapsus","t":"Bleu de méthylène 1–2 mg/kg","f":"poppers","nt":"","src":["rfe-t4"],"img":""},{"a":"Laroxyl (amitriptyline) détourné","s":"Syndrome anticholinergique, QRS large","t":"Bicarbonate molaire si QRS ≥ 120 ms","f":"","nt":"Voir la fiche médicament Amitriptyline","src":["aact-tca"],"img":""},{"a":"Chemsex","s":"Association stimulants (cathinones) + psychodysleptiques (kétamine) + dépresseurs (GHB) + viagra/poppers","t":"Prise en charge du toxidrome dominant","f":"nps-autres","nt":"En pré-hospitalier, les interventions sont souvent liées au surdosage en GHB","src":["info-bmpm"],"img":""}]},{"cat":"Autolyse","ic":"alert","items":[{"a":"Nitrite de sodium","s":"Méthémoglobinémie : cyanose grise réfractaire à l'oxygénothérapie, SpO₂ bloquée, dyspnée, collapsus, décès rapide","t":"Bleu de méthylène le plus tôt possible : 1 à 2 mg/kg sans dépasser 100 mg, renouvelable si pas d'amélioration. Exsanguino-transfusion ou OHB dans les formes réfractaires","f":"","nt":"En forte augmentation depuis 2020 (kits et tutoriels vendus en ligne), mortalité de 40 % dans les cas rapportés en 2023. Produit en vente libre (usage agroalimentaire). Évoquer devant une cyanose qui ne répond pas à l'oxygène","src":["cap-nitrite","rfe-t4"],"img":"nitrite"},{"a":"Raticides à l'alpha-chloralose","s":"Délai de 1 à 2 h. Coma avec myoclonies, hyperréflexie, convulsions déclenchées par les stimuli tactiles, auditifs ou visuels. Hypersécrétion bronchique fréquente, dépression respiratoire","t":"Pas d'antidote. Traitement symptomatique : contrôle des convulsions et de l'hypersécrétion bronchique. Charbon activé dans l'heure si pas de somnolence ni vomissement","f":"","nt":"1 g peut suffire à provoquer convulsions et coma chez l'adulte ; un comprimé de 200 mg a suffi chez le jeune enfant. Première cause d'intoxication volontaire au Maghreb. Manipuler le patient dans le calme : les stimuli déclenchent les convulsions","src":["cap-belgique-chloralose"],"img":"chloralose"},{"a":"Raticides anticoagulants","s":"Hémorragies différées de plusieurs jours (antivitamines K de 2e génération, demi-vie très longue)","t":"Vitamine K1 à fortes doses et prolongée (plusieurs semaines). PPSB si hémorragie grave","f":"anticoag","nt":"Contrôler l'INR à 48 h : un INR normal initial ne rassure pas","src":["rfe-t4","info-bmpm-anticoag"],"img":""},{"a":"Organophosphorés (Sniper, DDVP)","s":"Syndrome cholinergique","t":"Atropine + pralidoxime","f":"nop","nt":"Produit interdit en France mais largement disponible via le marché parallèle. Ingestion volontaire de plus en plus décrite","src":["info-bmpm"],"img":"sniper"},{"a":"Éthylène glycol et méthanol (antigel, alcool à brûler)","s":"Phase 1 : ébriété sans odeur d'alcool · Phase 2 (12–24 h) : acidose métabolique à trou anionique élevé avec trou osmolaire · Phase 3 : insuffisance rénale (éthylène glycol, cristaux d'oxalate) ou cécité (méthanol)","t":"Fomépizole (ou éthanol) sans attendre la confirmation analytique. Bicarbonate. Acide folinique (méthanol), thiamine et pyridoxine (éthylène glycol). Hémodialyse (RFE R5.1)","f":"","nt":"Intervalle libre trompeur : c'est le métabolite qui est toxique, le traitement doit être débuté avant l'apparition des signes. Doser le trou osmolaire précocement","src":["rfe-r51","info-bmpm-regul"],"img":""},{"a":"Laurier rose","s":"Effet digitalique : bradycardie, bloc auriculoventriculaire, hyperkaliémie, troubles du rythme ventriculaire","t":"Scope. Fragments Fab antidigitaliques, atropine, correction de la kaliémie","f":"","nt":"Risque rythmique. À ne pas confondre avec la ciguë, dont la prise en charge est entièrement différente","src":["inspq-digifab"],"img":""},{"a":"Ciguë","s":"Mydriase et hypersalivation initiales, puis paralysie flasque ascendante avec paralysie respiratoire","t":"Surveillance respiratoire et ventilation mécanique. Pas d'antidote","f":"","nt":"Risque respiratoire. À ne pas confondre avec le laurier rose, dont la prise en charge est entièrement différente","src":["fpn-cigue"],"img":""},{"a":"Médicaments","s":"Le plus fréquent. Souvent polymédicamenteux","t":"Voir l'onglet Médicaments et le calculateur","f":"","nt":"Toujours rechercher une coingestion de paracétamol","src":["rfe-r621"],"img":""}]},{"cat":"Feu / incendie","ic":"flame","lien":{"s":"smurbmpm-flamme","u":"https://smurbmpm.fr/toxicologie/la-flamme/","t":"Vue globale : fumées d'incendie"},"items":[{"a":"Cyanure (HCN)","s":"Collapsus, mydriase, troubles digestifs et neurologiques, arrêt cardiorespiratoire. Hyperlactatémie","t":"Hydroxocobalamine (CYANOKIT) 5 g IV en 15 min (enfant 70 mg/kg, max 5 g), renouvelable une fois","f":"cyanures","nt":"Lactate ≥ 8 mmol/L chez une victime d'incendie : forte présomption d'intoxication cyanhydrique","src":["info-bmpm"],"img":""},{"a":"Monoxyde de carbone (CO)","s":"Céphalées (85 %), vertiges (69 %), fatigue (67 %), nausées (52 %), confusion (37 %), perte de connaissance (35 %), troubles cardiaques et digestifs, arrêt cardiorespiratoire","t":"O₂ 100 % au masque à haute concentration jusqu'à HbCO < 10 %, puis 2 à 3 h supplémentaires. Oxygénothérapie hyperbare selon indications","f":"","nt":"Demi-vie de la HbCO : ~5 h à l'air ambiant, ~1 h sous O₂ 100 %. OHB : syncope, trouble de conscience, convulsion, coma, déficit focal, grossesse avec HbCO > 15 %, HbCO > 25 %, ischémie myocardique. Les symptômes corrèlent mal avec le taux de HbCO","src":["wikem-co","echm-2016"],"img":""},{"a":"Fumées d'incendie (association)","s":"Association quasi constante CO + cyanure + suffocants","t":"O₂ 15 L/min systématique + hydroxocobalamine si signes de gravité","f":"","nt":"Ne jamais raisonner sur un seul toxique dans les fumées d'incendie","src":["info-bmpm"],"img":""}]},{"cat":"Industrie / travail","ic":"factory","items":[{"a":"Gaz chlore ou dichlore","s":"Irritation des voies aériennes, bronchospasme, OAP lésionnel retardé","t":"Symptomatique : O₂, β2, corticoïdes. Surveillance 24 h","f":"suffocants","nt":"Mélange eau de Javel + détartrant : production domestique de chlore, cause fréquente","src":["sfmu-suffocants"],"img":""},{"a":"Hydrogène sulfuré (H₂S) — égouts, lisier","s":"Odeur d'œuf pourri aux faibles concentrations puis paralysie olfactive à partir de 100 ppm. 500–700 ppm : collapsus en 5 min. 700–1000 ppm : « knockdown », perte de connaissance en 1 à 2 inspirations. Conjonctivite, OAP retardé jusqu'à 72 h, séquelles neuropsychiatriques","t":"Extraction (ARI indispensable), O₂ 100 % au masque à haute concentration pour tous. Hydroxocobalamine 5 g IV (préférée). Nitrite de sodium en alternative. Pas de thiosulfate","f":"","nt":"Même mécanisme que le cyanure (inhibition du cytochrome c oxydase). L'odeur n'est PAS un indicateur de sécurité : elle disparaît quand la concentration devient dangereuse. Accidents collectifs typiques en espace confiné, y compris chez les sauveteurs","src":["wikem-h2s"],"img":""},{"a":"Pesticides agricoles","s":"Organophosphorés (Sniper, DDVP) ou carbamates : syndrome cholinergique","t":"Atropine + pralidoxime (organophosphorés)","f":"nop","nt":"Les carbamates donnent une inhibition réversible : pralidoxime non indiquée","src":["info-bmpm"],"img":"sniper"},{"a":"Solvants (toluène, xylène)","s":"Syndrome AOSTE : troubles du rythme ++++, hypotension, coma calme, mydriase, hypersécrétions locales","t":"Symptomatique. Éviter les catécholamines (sensibilisation du myocarde)","f":"","nt":"Dosage hospitalier : acide hippurique (toluène), acide méthylhippurique (xylène)","src":["info-bmpm"],"img":""},{"a":"Métaux lourds (plomb, mercure, arsenic)","s":"Aigu : troubles digestifs violents, encéphalopathie, atteinte rénale. Chronique : neuropathie, anémie","t":"Avis centre antipoison impératif avant chélation. Plomb : succimer (DMSA) ou EDTA calcique + BAL. Mercure et arsenic : BAL ou DMPS","f":"","nt":"La chélation se discute dans les 2 h suivant le diagnostic d'intoxication aiguë. EER possible pour l'aluminium et le fer ; peu de données pour les autres métaux","src":["ciusss-chelateurs"],"img":""},{"a":"Alcool isopropylique (décapants, solvants, SHA)","s":"Coma, cétose sans acidose, gastrite hémorragique","t":"Symptomatique. EER recommandée","f":"","nt":"Présent dans les solutions hydro-alcooliques : ingestion détournée décrite","src":["info-bmpm"],"img":""}]},{"cat":"Ingestion — plantes","ic":"leaf","items":[{"a":"Laurier rose, digitale, muguet","s":"Effet digitalique : vomissements, bradycardie, bloc auriculoventriculaire, hyperkaliémie, troubles du rythme ventriculaire","t":"Scope dès l'admission. Fragments Fab antidigitaliques · atropine · correction de la kaliémie","f":"","nt":"Hétérosides cardiotoniques : la digoxinémie est faussement basse ou ininterprétable, se fier à l'ECG et à la kaliémie. Avis du centre antipoison pour la posologie des Fab. Rien à voir avec la ciguë : ici le risque est rythmique, pas respiratoire","src":["inspq-digifab"],"img":""},{"a":"Ciguë (Conium maculatum)","s":"Phase initiale : mydriase, bronchorrhée, tachycardie, hypersalivation, vomissements. Puis bradycardie, paralysie flasque ascendante avec paralysie respiratoire, convulsions, rhabdomyolyse","t":"Surveillance respiratoire rapprochée et ventilation mécanique : c'est le seul traitement qui sauve. Benzodiazépines si convulsions. Pas d'antidote, hémodialyse inefficace","f":"","nt":"La coniine est d'abord agoniste puis antagoniste nicotinique : effet curare-like avec paralysie ascendante. Le danger est respiratoire et non rythmique, à l'inverse du laurier rose. Confusion avec le persil ou le panais sauvage","src":["fpn-cigue"],"img":""},{"a":"Aconit (Aconitum napellus)","s":"Paresthésies péribuccales puis généralisées, vomissements, troubles du rythme ventriculaire réfractaires, bradycardie, collapsus","t":"Traitement symptomatique. Amiodarone ou flécaïnide en cas d'arythmie ventriculaire. ECMO-VA à discuter","f":"","nt":"Activation persistante des canaux sodiques. Revue de 65 cas : amiodarone efficace dans 11/20, flécaïnide dans 6/7. Plante la plus toxique de la flore française","src":["aact-aconit"],"img":""},{"a":"Belladone, datura, jusquiame, mandragore","s":"Syndrome anticholinergique franc : mydriase, peau sèche et rouge, hyperthermie, délire, rétention urinaire, tachycardie","t":"Benzodiazépines, refroidissement. Néostigmine si forme grave (RFE Tableau 4)","f":"","nt":"Le datura fait l'objet d'un usage récréatif ; les graines sont très concentrées en alcaloïdes","src":["rfe-t4"],"img":""},{"a":"Ricin (ricine)","s":"Forme ingérée : vomissements et diarrhées sanglantes différés de 4 à 6 h, puis défaillance multiviscérale. Forme inhalée : toux, dyspnée, fièvre et douleur thoracique en 4 à 8 h, puis œdème pulmonaire lésionnel et détresse respiratoire aiguë en 18 à 24 h","t":"Traitement symptomatique, réhydratation. Pas d'antidote. Forme inhalée : oxygénothérapie, ventilation protectrice","f":"","nt":"Quelques graines mâchées suffisent par voie orale. La forme inhalée ne s'observe pratiquement que dans un contexte d'utilisation malveillante : la ricine est un agent du risque biologique, inscrit à la convention sur les armes chimiques. Devant un tableau respiratoire évocateur, alerter les autorités","src":["info-bmpm"],"img":""}]},{"cat":"Ingestion — champignons","ic":"mushroom","lien":{"s":"smurbmpm-champi","u":"https://smurbmpm.fr/contenu-pedagogique/les-intoxications-aux-champignons/","t":"Vue globale : champignons"},"items":[{"a":"Délai < 6 h : syndromes précoces","s":"Résinoïdien (le plus fréquent), panthérinien, sudorien, paxillien, coprinien","t":"Habituellement bénins. Traitement symptomatique","f":"sd-resinoidien","nt":"Avis centre antipoison dans tous les cas","src":["info-bmpm-champi"],"img":""},{"a":"Délai > 6 h : syndromes tardifs","s":"Phalloïdien, gyromitrien, orellanien, proximien","t":"Potentiellement mortels. Hospitalisation systématique","f":"sd-phalloidien","nt":"Un délai supérieur à 6 h entre le repas et les premiers signes impose d'évoquer un syndrome phalloïdien","src":["info-bmpm-champi"],"img":""}]},{"cat":"Armes chimiques / NRBC","ic":"nrbc","lien":{"s":"smurbmpm-nrbc","u":"https://smurbmpm.fr/toxicologie/nrbc-les-agents-chimiques/","t":"Vue globale : agents chimiques"},"items":[{"a":"Neurotoxiques organophosphorés","s":"Syndrome cholinergique : myosis, hypersécrétions, bradypnée, convulsions","t":"Atropine + pralidoxime + AIBC","f":"nop","nt":"","src":["info-bmpm"],"img":""},{"a":"Vésicants","s":"Phlyctènes, atteinte oculaire et respiratoire, différées","t":"Décontamination, symptomatique. Lewisite : B.A.L.","f":"vesicants","nt":"","src":["info-bmpm"],"img":""},{"a":"Suffocants","s":"Irritation puis OAP lésionnel retardé","t":"Symptomatique, surveillance prolongée","f":"suffocants","nt":"","src":["info-bmpm"],"img":""},{"a":"Cyanure","s":"Coma, mydriase, collapsus, hyperlactatémie","t":"Hydroxocobalamine","f":"cyanures","nt":"","src":["info-bmpm"],"img":""},{"a":"Opioïdes (agent incapacitant)","s":"Coma, myosis, apnée","t":"Naloxone","f":"opioides-nrbc","nt":"","src":["info-bmpm"],"img":""}]},{"cat":"Morsure / piqûre","ic":"bite","note":"Contenu valable uniquement pour la France métropolitaine. Ne jamais garroter. Les dispositifs d’aspiration et les kits « anti-venin » de terrain sont contre-indiqués : inefficaces, ils retardent la prise en charge et aggravent les lésions locales. Pas d’incision, pas de succion, pas de glace. En cas de NAC (nouvel animal de compagnie) ou hors métropole, essayer d’obtenir le nom de l’espèce — photo du terrarium, facture, dire d’un proche — et en référer au centre antipoison : les espèces, les venins et les sérums antivenimeux sont différents.","items":[{"a":"Serpents — reconnaître la morsure","s":"Vipère : deux traces de crochets espacées de 6 à 10 mm, douleur immédiate, œdème qui s'installe en quelques minutes à quelques heures. Couleuvre : arc ou double arc de petites marques dentaires superficielles, sans crochets, sans œdème extensif","t":"Distinguer les deux conditionne toute la prise en charge : la couleuvre ne relève que des soins locaux, la vipère d'une surveillance hospitalière et parfois d'une immunothérapie","f":"","nt":"En France métropolitaine, seules les vipères (aspic, péliade, ammodyte) sont venimeuses pour l'homme. Dans tous les cas : pas de garrot, pas d'incision, pas d'aspiration, pas de succion, pas de glace","src":["sfmu-viperes","hcl-viperes"],"img":""},{"a":"Couleuvres (non venimeuses)","s":"Arc de petites marques dentaires superficielles. Saignement minime. Pas d'œdème extensif, pas de signe général","t":"Désinfection, lavage abondant, vérification de la vaccination antitétanique. Antalgiques simples. Pas de sérum antivenimeux, pas de surveillance hospitalière prolongée","f":"","nt":"La couleuvre de Montpellier possède des crochets postérieurs mais sa morsure reste bénigne chez l'homme. En cas de doute sur l'espèce, surveiller comme une morsure de vipère pendant 6 h","src":["sfmu-viperes"],"img":"couleuvre"},{"a":"Vipères — grades et immunothérapie","s":"Grade 0 : traces de crochets seules, aucun symptôme · Grade I : œdème limité au site de morsure, douleur modérée · Grade IIA : œdème extensif (> 4 cm) et/ou suffusion hématique au-delà des points de morsure et/ou douleur intense · Grade IIB : critères du IIA plus signes généraux (digestifs, cardiovasculaires, neurologiques) et/ou signes biologiques de gravité · Grade III : œdème étendu au tronc et/ou signes généraux sévères (réaction anaphylactoïde, choc, OAP, insuffisance rénale, coagulopathie)","t":"Immunothérapie à partir du grade II, le plus précocement possible. Surveillance : 6 h au grade 0, 24 h au grade I avec bilan biologique à 12 h. Avis du centre antipoison avant administration et avant tout renouvellement","f":"","nt":"Critères biologiques de gravité (grade IIB) : leucocytes > 15 000/mm³, plaquettes < 150 000/mm³, TP < 60 %, fibrinogène < 2 g/L. Penser au syndrome des loges sur œdème extensif","src":["hcl-viperes","sfmu-viperes"],"img":"vipere"},{"a":"⚠ VIPERFAV et VIPERATAB : ne pas confondre","s":"Deux spécialités distinctes, de composition, de dose et de rythme d'administration différents. L'ANSM a émis une alerte sur le risque d'erreur médicamenteuse","t":"VIPERFAV — fragments F(ab')₂ équins, V. aspis / berus / ammodytes. Dose initiale 4 ml (1 flacon) dans 100 ml de NaCl 0,9 %, perfusion sur 1 h à débit initial réduit (50 ml/h). Jusqu'à 2 renouvellements à 5 h d'intervalle. · VIPERATAB — fragments Fab ovins, V. berus uniquement. Dose initiale 8 ml (2 ampoules) dans 100 ml de NaCl 0,9 %, perfusion sur 30 min, surveillance médicale ≥ 1 h. Renouvellement systématique une fois (deux fois pour V. aspis), à 4 h d'intervalle","f":"","nt":"Même dose chez l'enfant que chez l'adulte, quel que soit le poids : c'est le rapport venin/masse corporelle qui fait la gravité. Vérifier le nom de la spécialité sur le flacon avant de calculer la dose","src":["ansm-viperfav-viperatab","ansm-viperfav"],"img":""},{"a":"Scorpion","s":"Signes locaux de type piqûre d'abeille : douleur, érythème","t":"Traitement symptomatique, antalgiques","f":"","nt":"Pas de danger en France métropolitaine","src":["info-bmpm"],"img":""},{"a":"Araignée — latrodectisme (veuve noire)","s":"Troubles neurovégétatifs : sueurs profuses, variations tensionnelles, contractures abdominales très douloureuses","t":"Antalgiques, benzodiazépines, surveillance. Hospitalisation si forme sévère","f":"","nt":"Latrodectus tredecimguttatus, surtout en zones peu urbanisées et en Corse. Pas de décès attendu en France métropolitaine","src":["rdp-araignees"],"img":""},{"a":"Araignée — loxoscélisme","s":"Syndrome viscéro-nécrotique différé : vésicule au point de morsure, puis placard érythémato-violacé pouvant évoluer vers une nécrose. Rarement hémolyse et insuffisance rénale","t":"Désinfection, antalgiques, antihistaminiques si prurit. Antibiothérapie si surinfection (amoxicilline-acide clavulanique). Une chirurgie de nécrosectomie est parfois nécessaire sur les formes nécrotiques étendues, à distance de la phase aiguë","f":"","nt":"Atteinte générale rare, surtout chez l'immunodéprimé. Évolution locale souvent lente, sur plusieurs semaines : suivi chirurgical à prévoir","src":["rdp-araignees"],"img":"loxo"}]}],"antidotes":[{"g":"RFE Tableau 4 — antidotes généraux","sub":"Recommandations Formalisées d'Experts SRLF-SFMU","items":[{"tox":"Paracétamol","ant":"N-acétylcystéine","ind":["Paracétamolémie au-delà de la ligne à 150 mg/L à H4 (nomogramme de Rumack & Matthew)","Délai de prise inconnu ou trouble de conscience (poursuite si paracétamolémie non nulle ou élévation des ALAT)","Facteur de vulnérabilité : hépatopathie chronique, carence nutritionnelle","Admission tardive au-delà de H24 post-exposition avec augmentation des ALAT","Prise répétée de paracétamol à dose suprathérapeutique"],"d":"< 2 heures","c":"Grade 1 + / Avis d'experts","src":["rfe-t4","rfe-r621"],"ep":["MARS"],"nt":"Dialyse hépatique (MARS) recommandée dans l'hépatite toxique fulminante."},{"tox":"Opioïdes","ant":"Naloxone","ind":["Coma et/ou dépression respiratoire justifiant une intubation"],"d":"Immédiat","c":"Grade 1 +","src":["rfe-t4","r
