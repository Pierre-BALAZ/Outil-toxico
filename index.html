ns, insuffisance rénale, pH < 7,2, œdème pulmonaire","Salicylémie > 1000 mg/L, ou > 900 mg/L avec insuffisance rénale","Ascension malgré décontamination et alcalinisation"],"src":["rfe-r51","austin-salicyl"],"nt":"Alcalinisation des urines en première intention (RFE R5.3)."},{"n":"Phénobarbital","tech":"EER","ind":["Coma profond prolongé","Intoxication grave"],"src":["rfe-r51"],"nt":"Charbon en doses répétées et alcalinisation des urines en complément."},{"n":"Acide valproïque","tech":"EER","ind":["Ingestion > 1 g/kg avec concentration > 1000 mg/L","Toute ingestion avec concentration > 1500 mg/L","Instabilité hémodynamique et/ou acidose lactique"],"src":["rfe-r51","litfl-valp"],"nt":""},{"n":"Théophylline","tech":"EER","ind":["Concentration > 100 mg/L en aigu, > 60 mg/L en chronique","Arythmie, hypotension ou convulsions"],"src":["rfe-r51","litfl-theo"],"nt":""},{"n":"Méthanol","tech":"EER","ind":["Acidose métabolique sévère","Troubles visuels","Associer le fomépizole"],"src":["rfe-r51","info-bmpm-regul"],"nt":""},{"n":"Éthylène glycol","tech":"EER","ind":["Acidose métabolique sévère","Insuffisance rénale","Associer le fomépizole"],"src":["rfe-r51","info-bmpm-regul"],"nt":""},{"n":"Alcool isopropylique","tech":"EER","ind":["Coma, instabilité hémodynamique"],"src":["info-bmpm-regul"],"nt":"Présent dans les décapants, les solvants et certaines solutions hydro-alcooliques."},{"n":"Métaux lourds (aluminium, fer)","tech":"EER","ind":["Intoxication aiguë confirmée"],"src":["info-bmpm-regul"],"nt":"Peu de données pour les autres métaux."},{"n":"Barbituriques · digitaliques","tech":"EER discutable","ind":["Au cas par cas, avis du centre expert"],"src":["info-bmpm-regul"],"nt":""}]},{"tech":"ECMO","titre":"ECMO veino-artérielle","coul":"#D64D9E","p":"Circulation extra-corporelle avec suppléance des échanges gazeux et assistance circulatoire. Recommandée dans la défaillance circulatoire réfractaire. Orientation d'emblée vers un centre expert si le recours est possible (RFE R1.3.2).","items":[{"n":"Bêtabloquants","tech":"ECMO-VA","ind":["Choc cardiogénique réfractaire aux catécholamines, au glucagon et à l'insuline-glucose"],"src":["info-bmpm-regul","rfe-t6"],"nt":""},{"n":"Inhibiteurs calciques","tech":"ECMO-VA","ind":["Choc vasoplégique ou cardiogénique réfractaire"],"src":["info-bmpm-regul","rfe-t6"],"nt":"Amlodipine : vasoplégie pouvant durer plusieurs jours du fait de la demi-vie de 35 à 50 h."},{"n":"Cardiotropes cachés : NPS, cocaïne, antidépresseurs","tech":"ECMO-VA","ind":["Choc réfractaire","Arrêt cardiaque réfractaire"],"src":["info-bmpm-regul"],"nt":"Attention aux cardiotropes cachés : il ne s'agit pas forcément de médicaments « cardiaques »."},{"n":"Toxiques à effet stabilisant de membrane","tech":"ECMO-VA","ind":["Arrêt cardiaque ou choc réfractaire malgré le bicarbonate molaire"],"src":["rfe-t6","austin-flec"],"nt":"Flécaïnide, propafénone, tricycliques, chloroquine, propranolol, acébutolol."}]},{"tech":"MARS","titre":"Dialyse hépatique (MARS)","coul":"#2B8FD6","p":"Élimination des toxiques liés à l'albumine, associée à une hémofiltration. Recommandée dans l'hépatite toxique fulminante. Avis RPPF pour discuter une greffe hépatique ; en pratique, la dialyse hépatique reste rare.","items":[{"n":"Paracétamol","tech":"MARS","ind":["Hépatite toxique fulminante"],"src":["info-bmpm-regul","rfe-r621"],"nt":"La N-acétylcystéine reste le traitement de référence, quasi totalement protectrice avant H8."},{"n":"Amanite phalloïde","tech":"MARS","ind":["Hépatite toxique fulminante"],"src":["info-bmpm-regul","info-bmpm-champi"],"nt":"Associer N-acétylcystéine et silibinine."}]}],"epuration":{"tel":[{"n":"RDU (régulation)","v":"04 13 42 96 35"},{"n":"RPPF","v":"04 91 38 98 88"},{"n":"Centre antipoison de Marseille","v":"04 91 75 25 25"}],"blocs":[{"t":"EER (dialyse)","coul":"#D8A318","p":"Élimination des toxiques hydrosolubles. Plusieurs types d'hémofiltration. L'hémodialyse intermittente doit être privilégiée (RFE R5.1).","l":["Salicylés (aspirine)","Lithium","Acide valproïque","Méthanol","Éthylène glycol","Alcool isopropylique (décapants, solvants, certains antiseptiques / SHA)","Metformine","Théophylline (Dilatrane, Euphylline, Tédralan)","Phénobarbital","Métaux lourds (aluminium et fer ; peu de données pour les autres)"],"n":"EER discutable : barbituriques, digitaliques… Critères physicochimiques favorables : poids moléculaire < 500 Da, volume de distribution < 1 L/kg, liaison protéique < 60 %, clairance endogène < 4 ml/min/kg.","src":["info-bmpm-regul","rfe-r51"]},{"t":"ECMO veino-artérielle","coul":"#D64D9E","p":"Circulation extra-corporelle avec suppléance des échanges gazeux. VV = sans assistance circulatoire ; VA = avec assistance circulatoire.","l":["Bêtabloquants","Inhibiteurs calciques","Cardiotropes cachés : NPS, cocaïne, antidépresseurs"],"n":"Recommandée dans la défaillance circulatoire réfractaire. Orientation d'emblée vers un centre expert si recours possible (RFE R1.3.2).","src":["info-bmpm-regul","rfe-r132"]},{"t":"Dialyse hépatique (MARS)","coul":"#2B8FD6","p":"Élimination des toxiques liés à l'albumine, associée à une hémofiltration.","l":["Paracétamol +++","Amanite phalloïde"],"n":"Recommandée dans l'hépatite toxique fulminante. Avis RPPF pour discuter une greffe hépatique ; en pratique la dialyse hépatique reste rare.","src":["info-bmpm-regul"]}],"rappels":["Attention aux cardiotropes cachés : il ne s'agit pas forcément de médicaments « cardiaques ».","Toxique fonctionnel : dépression d'une fonction d'organe sans lésion. L'apparition des signes suit le pic plasmatique de la molécule.","Toxique lésionnel : lésion d'organe. L'apparition des signes cliniques ou biologiques est souvent différée et correspond à l'atteinte et à la dysfonction de l'organe concerné.","Devant toute intoxication grave : avis de la filière toxicologique."]},"rfe":[{"id":"R1.1","t":"Il ne faut pas utiliser les scores ETC, MPDS et PSS pour évaluer la gravité d'un patient suspect d'intoxication médicamenteuse ou par drogue récréative.","g":"Recommandation forte"},{"id":"R1.2","t":"En pré-hospitalier, déclencher un moyen de secours médicalisé en présence d'une défaillance neurologique, hémodynamique ou respiratoire. Dans les autres cas, tenir compte du risque d'aggravation rapide selon le terrain, le délai et la nécessité d'un traitement précoce.","g":"Avis d'experts"},{"id":"R1.3.1","t":"Admission en réanimation ou USC en cas de défaillance d'organe avérée, d'exposition à un cardiotoxique avec tout signe objectif anormal, ou d'exposition à dose toxique pouvant conduire à une défaillance d'organe — même peu symptomatique, dans un délai < 6 h (ou plus si forme à libération prolongée).","g":"Avis d'experts"},{"id":"R1.3.2","t":"Admission d'emblée en centre expert si recours possible à une thérapeutique d'accès restreint (ECMO, épuration spécifique, antidote à disponibilité réduite).","g":"Avis d'experts"},{"id":"R1.4","t":"Prise en charge possible hors milieu de surveillance médicale si le patient est asymptomatique, les toxiques bien identifiés et de demi-vie courte, les examens complémentaires normaux et l'évaluation psychiatrique faite en cas de contexte d'autolyse.","g":"Avis d'experts"},{"id":"R2.2","t":"Ne pas réaliser systématiquement de screening toxicologique dans le but d'améliorer la prise en charge. Cette recherche peut être réalisée dans un but informatif.","g":"Avis d'experts"},{"id":"R2.3.1","t":"Réaliser un dosage des molécules supposées ingérées pour les intoxications au paracétamol, à l'acide acétylsalicylique, à l'acide valproïque, à la digoxine et au lithium.","g":"Recommandation forte"},{"id":"R3.1","t":"En cas de défaillance hémodynamique, neurologique ou respiratoire non réversible par un antidote : intubation trachéale avec induction à séquence rapide.","g":"Avis d'experts"},{"id":"R4.1.1","t":"Il ne faut probablement pas réaliser systématiquement un lavage gastrique.","g":"Grade 2 −"},{"id":"R4.1.2","t":"Lavage gastrique dans un délai < 1 h, sans contre-indication, en cas d'ingestion d'une substance non carbo-adsorbable, à dose supposée toxique et à fort potentiel lésionnel.","g":"Avis d'experts"},{"id":"R4.2.2","t":"Dose unique de charbon activé sans contre-indication et dans un délai < 1 h après l'ingestion d'une substance carbo-adsorbable à dose supposée toxique.","g":"Avis d'experts"},{"id":"R4.2.3","t":"Doses répétées de charbon activé réservées à l'ingestion d'un médicament à libération prolongée ou d'une substance à cycle entéro-hépatique marqué, à dose supposée toxique ou en cas d'intoxication potentiellement grave.","g":"Avis d'experts"},{"id":"R4.3","t":"Discuter une irrigation intestinale en cas d'ingestion d'une substance non carbo-adsorbable ou à libération prolongée avec risque vital, ou de packs de substances illicites (body-packing).","g":"Avis d'experts"},{"id":"R5.1","t":"Épuration extra-rénale en cas d'intoxication grave par lithium, metformine, salicylés, phénobarbital, acide valproïque ou théophylline. Privilégier l'hémodialyse intermittente.","g":"Avis d'experts"},{"id":"R5.3","t":"Diurèse alcaline pour augmenter la clairance des salicylés en cas d'intoxication symptomatique.","g":"Avis d'experts"},{"id":"R6.1.2","t":"Il faut utiliser la naloxone chez le patient présentant un coma supposé par surdosage en opioïdes lorsque son état nécessite une intubation, afin de l'éviter.","g":"Grade 1 +"},{"id":"R6.2.1","t":"Administrer la N-acétylcystéine en cas d'ingestion unique d'horaire connu si la paracétamolémie après la 4e heure est au-delà de la ligne de toxicité hépatique (150 mg/L à H4).","g":"Grade 1 +"},{"id":"R6.3.1","t":"Lorsqu'un antidote existe, ne pas l'administrer de manière systématique.","g":"Avis d'experts"},{"id":"R6.3.2","t":"En cas d'exposition à un toxique fonctionnel, administrer probablement un antidote en présence de signes de gravité.","g":"Grade 2 +"},{"id":"R6.3.3","t":"En cas d'exposition à une dose toxique d'un toxique lésionnel, administrer probablement un antidote selon ses modalités spécifiques, de préférence avant l'apparition des lésions tissulaires.","g":"Grade 2 +"},{"id":"R7.3","t":"Administrer la cyproheptadine en cas d'hyperthermie attribuable au toxique chez un patient intoxiqué par NPS (notamment cathinones), en association au traitement symptomatique.","g":"Avis d'experts"},{"id":"R8.1.1","t":"Administrer un antidote chez tout patient suspect d'intoxication par cardiotrope présentant un critère de gravité clinique ou pronostique.","g":"Avis d'experts"},{"id":"R8.1.2","t":"En cas d'hypotension artérielle d'origine toxique, effectuer en première intention un remplissage vasculaire.","g":"Grade 1 +"},{"id":"R8.1.3","t":"Au cours du choc toxique, administrer une catécholamine en cas d'échec du remplissage vasculaire.","g":"Grade 1 +"},{"id":"R8.1.4","t":"En cas d'état de choc toxique sans évaluation hémodynamique, utiliser en première intention la noradrénaline ou l'adrénaline selon la présentation clinique et le toxique en cause.","g":"Avis d'experts"}],"sources":[{"id":"rfe-t4","t":"RFE SRLF-SFMU — Tableau 4 : indications et délais recommandés de disponibilité des principaux antidotes","a":"Mégarbane B, Oberlin M et al., Société de Réanimation de Langue Française / Société Française de Médecine d'Urgence","y":"Prise en charge des intoxications médicamenteuses et par drogues récréatives","u":"https://www.srlf.org/","n":"Document fourni par l'utilisateur (RFE_Toxico_sfmu.pdf), pages 61–65.","c":"Antidotes"},{"id":"rfe-t5","t":"RFE SRLF-SFMU — Tableau 5 : signes de gravité des intoxications par drogues récréatives","a":"Mégarbane B, Oberlin M et al., SRLF / SFMU","y":"RFE communes SRLF-SFMU","u":"https://www.srlf.org/","n":"Pages 66–69 du document fourni.","c":"Drogues"},{"id":"rfe-t6","t":"RFE SRLF-SFMU — Tableau 6 : principaux antidotes des cardiotropes","a":"Mégarbane B, Oberlin M et al., SRLF / SFMU","y":"RFE communes SRLF-SFMU","u":"https://www.srlf.org/","n":"Page 70 du document fourni.","c":"Cardiotropes"},{"id":"rfe-r51","t":"RFE SRLF-SFMU — R5.1 : épuration extra-rénale","a":"SRLF / SFMU","y":"Champ 5 : traitements épurateurs","u":"https://www.srlf.org/","n":"Lithium, metformine, salicylés, phénobarbital, acide valproïque, théophylline.","c":"Épuration"},{"id":"rfe-r53","t":"RFE SRLF-SFMU — R5.3 : diurèse alcaline pour les salicylés","a":"SRLF / SFMU","y":"Champ 5","u":"https://www.srlf.org/","n":"","c":"Épuration"},{"id":"rfe-r423","t":"RFE SRLF-SFMU — R4.2.3 : charbon activé en doses répétées","a":"SRLF / SFMU","y":"Champ 4 : décontamination","u":"https://www.srlf.org/","n":"Formes à libération prolongée et cycle entéro-hépatique marqué.","c":"Décontamination"},{"id":"rfe-r612","t":"RFE SRLF-SFMU — R6.1.2 : naloxone (grade 1 +)","a":"SRLF / SFMU","y":"Champ 6 : place des antidotes","u":"https://www.srlf.org/","n":"","c":"Antidotes"},{"id":"rfe-r621","t":"RFE SRLF-SFMU — R6.2.1 et R6.2.2 : N-acétylcystéine (grade 1 +)","a":"SRLF / SFMU","y":"Champ 6","u":"https://www.srlf.org/","n":"Nomogramme de Rumack & Matthew, ligne 150 mg/L à H4.","c":"Antidotes"},{"id":"rfe-r73","t":"RFE SRLF-SFMU — R7.3 : cyproheptadine et NPS","a":"SRLF / SFMU","y":"Champ 7 : drogues récréatives","u":"https://www.srlf.org/","n":"","c":"Drogues"},{"id":"rfe-r132","t":"RFE SRLF-SFMU — R1.3.2 : orientation vers un centre expert","a":"SRLF / SFMU","y":"Champ 1 : évaluation de la gravité et orientation initiale","u":"https://www.srlf.org/","n":"","c":"Orientation"},{"id":"rfe-nps","t":"RFE SRLF-SFMU — Encadré : classification des nouvelles substances psychoactives","a":"SRLF / SFMU","y":"RFE communes SRLF-SFMU","u":"https://www.srlf.org/","n":"Pages 71–73 du document fourni. Enquête DRAMES (ANSM).","c":"Drogues"},{"id":"info-bmpm","t":"Infographies SMUR BMPM — NOP, vésicants, suffocants, autres toxiques d'intérêt, drogues","a":"Dr Pierre Balaz, Bataillon de Marins-Pompiers de Marseille","y":"www.smurbmpm.fr — @SMURBMPM","u":"https://www.smurbmpm.fr","n":"Documents fournis par l'auteur, utilisés avec son accord.","c":"NRBC / Drogues"},{"id":"info-bmpm-champi","t":"Infographie « Le coin à champignons » — données PACA, France métropolitaine","a":"Dr Pierre Balaz (BMPM) et Dr Corinne Schmitt (CAP-TV Marseille)","y":"Sources citées : Trueb et al., « Intoxication par les champignons », Rev Med Suisse 2013 ; Toxicologie clinique, Baud & Garnier, 6e édition, 2017","u":"https://www.smurbmpm.fr","n":"Document fourni par l'auteur.","c":"Champignons"},{"id":"info-bmpm-regul","t":"Infographie « Toxico & Régul » — EER, ECMO-VA, dialyse hépatique, filière toxicologique de Marseille","a":"SMUR BMPM","y":"www.smurbmpm.fr","u":"https://www.smurbmpm.fr","n":"Document fourni par l'auteur.","c":"Épuration"},{"id":"sfmu-suffocants","t":"Fiche NRC — Agents suffocants","a":"Société Française de Médecine d'Urgence","y":"Corpus NRBC SFMU, mise à jour du 18/07/2024","u":"https://sfmu.org/upload/30_vieprofessionnelle/4_outils_pro/1_protocoles/05_corpusNRBC/FICHE_NRC-AGENTS_SUFFOCANTS18-07-24.pdf","n":"Intervalle libre de 2 à 24 h, jusqu'à 72 h pour la phosphine.","c":"NRBC"},{"id":"ansm-bdpm","t":"Base de données publique des médicaments — Résumés des caractéristiques du produit (RCP)","a":"ANSM / HAS / UNCAM","y":"base-donnees-publique.medicaments.gouv.fr","u":"https://base-donnees-publique.medicaments.gouv.fr/","n":"Source réglementaire française des données de pharmacocinétique (rubrique 5.2) et de surdosage (rubrique 4.9). Le Vidal étant une publication commerciale non librement accessible, les RCP de l'ANSM ont été utilisés : ce sont les documents officiels dont le Vidal est lui-même dérivé.","c":"Cinétique"},{"id":"ansm-laroxyl","t":"RCP LAROXYL 40 mg/ml, solution buvable (chlorhydrate d'amitriptyline)","a":"ANSM","y":"Mise à jour du 07/09/2012","u":"https://agence-prd.ansm.sante.fr/php/ecodex/rcp/R0213503.htm","n":"Demi-vie d'élimination : « elle est comprise entre 22 et 40 heures ». Surdosage : manifestations cardiovasculaires sévères, renforcement des symptômes anticholinergiques, coma parfois retardé ; surveillance des fonctions vitales pendant au moins cinq jours.","c":"Cinétique"},{"id":"ansm-viperfav","t":"RCP VIPERFAV, solution à diluer pour perfusion","a":"ANSM","y":"Fragments F(ab')₂ d'immunoglobuline équine antivenin de vipères européennes","u":"https://agence-prd.ansm.sante.fr/php/ecodex/rcp/R0422475.htm","n":"Indications : envenimations de grade II ou III. Posologie : 4 ml dilués dans 100 ml de NaCl 0,9 %, perfusion sur environ 1 h, renouvelable 2 fois à 5 h d'intervalle. Même dose chez l'enfant.","c":"Envenimations"},{"id":"aact-bb","t":"β-Blocker Ingestion: An Evidence-Based Consensus Guideline for Out-of-Hospital Management","a":"Wax PM, Erdman AR, Chyka PA et al., American Association of Poison Control Centers","y":"Clinical Toxicology, 2005","u":"https://www.clintox.org/wp-content/uploads/2016/05/Beta-Blocker-Ingestion.pdf","n":"Seuils d'orientation vers une structure d'urgence (Tableau 5) et durées de surveillance (recommandation 7).","c":"Seuils"},{"id":"aact-ica","t":"Calcium Channel Blocker Ingestion: An Evidence-Based Consensus Guideline for Out-of-Hospital Management","a":"Olson KR, Erdman AR, Woolf AD et al., AAPCC","y":"Clinical Toxicology, 2005","u":"https://www.clintox.org/wp-content/uploads/2016/05/Calcium-Channel-Blocker-Ingestion.pdf","n":"Seuils d'orientation (Tableau 11) et durées de surveillance : 6 h pour les formes à libération immédiate, 18 h pour les formes LP, 24 h pour le vérapamil LP.","c":"Seuils"},{"id":"aact-tca","t":"Tricyclic Antidepressant Poisoning: An Evidence-Based Consensus Guideline for Out-of-Hospital Management","a":"Woolf AD, Erdman AR, Nelson LS et al., AAPCC","y":"Clinical Toxicology, 2007","u":"https://www.clintox.org/wp-content/uploads/2016/05/Tricyclic-antidepressant-poisoning.pdf","n":"Seuils d'orientation : > 5 mg/kg pour la plupart des tricycliques, > 2,5 mg/kg pour désipramine, nortriptyline et trimipramine, > 1 mg/kg pour la protriptyline. Décision fondée sur l'état clinique dans les 6 premières heures.","c":"Seuils"},{"id":"aact-ssri","t":"Selective Serotonin Reuptake Inhibitor Poisoning: An Evidence-Based Consensus Guideline for Out-of-Hospital Management","a":"Nelson LS, Erdman AR, Booze LL et al., AAPCC","y":"Clinical Toxicology, 2007","u":"https://www.clintox.org/wp-content/uploads/2016/05/Serotonin-Reuptake-Inhibitor-SSRI-poisoning.pdf","n":"Seuil d'orientation : 5 fois la dose initiale usuelle chez l'adulte naïf. Citalopram : 400 mg est la plus faible dose associée à une toxicité au-delà de légère ; délai le plus long rapporté < 13 h.","c":"Seuils"},{"id":"aact-aconit","t":"The management of ventricular dysrhythmia in aconite poisoning: a review of published cases","a":"Coulson JM et al. — question du jour de l'American College of Medical Toxicology","y":"Clinical Toxicology, 2017","u":"https://www.clintox.org/question-of-the-day/question-of-the-day-friday-april-23-2021","n":"Sur 65 cas d'arythmie ventriculaire : amiodarone efficace dans 11/20 cas, flécaïnide dans 6/7.","c":"Plantes"},{"id":"litfl-propra","t":"Propranolol Overdose","a":"Life in the Fast Lane (LITFL) — Toxicology Library","y":"","u":"https://litfl.com/propanolol-overdose/","n":"Toute dose > 1 g est potentiellement létale. Pic de toxicité dans les 1 à 3 h. QRS > 100 ms associé aux convulsions, > 160 ms aux arythmies ventriculaires.","c":"Seuils"},{"id":"litfl-ica","t":"Calcium channel blocker toxicity","a":"LITFL — Toxicology Library","y":"","u":"https://litfl.com/calcium-channel-blocker-poisoning/","n":"Vérapamil ou diltiazem LP : plus de 10 comprimés peuvent provoquer une toxicité menaçant le pronostic vital. Formes LP : effets retardés jusqu'à 16 h.","c":"Seuils"},{"id":"litfl-quet","t":"Quetiapine toxicity","a":"LITFL — Toxicology Library","y":"","u":"https://litfl.com/quetiapine-toxicity/","n":"Au-delà de 3 g : risque croissant de dépression du SNC, coma et hypotension. Probabilité d'intubation estimée (Isbister et al.) : 2 g ≈ 10 %, 5 g ≈ 22 %, 10 g ≈ 37 %, 20 g ≈ 55 %.","c":"Seuils"},{"id":"litfl-amis","t":"Amisulpride toxicity","a":"LITFL — Toxicology Library","y":"","u":"https://litfl.com/amisulpride-toxicity","n":"< 4 g : sédation légère, QT long et torsades rares. > 4 g : risque croissant de QT long et de torsades, bradycardie, hypotension. Scope 16 h minimum.","c":"Seuils"},{"id":"litfl-lithium","t":"Lithium toxicity","a":"LITFL — Toxicology Library","y":"","u":"https://litfl.com/lithium-toxicity","n":"Ingestion aiguë < 25 g avec fonction rénale normale : symptômes digestifs mineurs. Formes LP : pic retardé jusqu'à 12 h.","c":"Seuils"},{"id":"litfl-snri","t":"SNRI toxicity (venlafaxine, desvenlafaxine)","a":"LITFL — Toxicology Library","y":"","u":"https://litfl.com/snri-toxicity/","n":"Risque convulsif : < 1,5 g ≈ 5 %, < 3 g ≈ 10 %, > 3 g > 30 %, > 4,5 g proche de 100 % avec hypotension et allongement du QRS/QT, > 7 g dysfonction ventriculaire gauche. Surveillance minimale 16 h.","c":"Seuils"},{"id":"litfl-bupro","t":"Bupropion toxicity","a":"LITFL — Toxicology Library","y":"","u":"https://litfl.com/bupropion-toxicity/","n":"> 4,5 g : risque convulsif 50 %. > 9 g : convulsions constantes, QRS et QT allongés, arythmies ventriculaires. Convulsions typiquement à 2–8 h, retardées jusqu'à 24 h avec les formes à libération prolongée. Enfant : évaluation dès 10 mg/kg.","c":"Seuils"},{"id":"litfl-tram","t":"Tramadol toxicity","a":"LITFL — Toxicology Library","y":"","u":"https://litfl.com/tramadol-toxicity/","n":"Convulsions attendues au-delà de 1,5 g chez l'adulte, retardées de plus de 6 h avec les formes à libération modifiée. Enfant : effets possibles dès 10 mg/kg. Pic : 1–3 h (IR), 2–12 h (LP).","c":"Seuils"},{"id":"litfl-colch","t":"Colchicine toxicity","a":"LITFL — Toxicology Library","y":"","u":"https://litfl.com/colchicine-toxicity","n":"< 0,5 mg/kg : symptômes digestifs seuls. 0,5–0,8 mg/kg : toxicité systémique, mortalité ~10 %. > 0,8 mg/kg : collapsus cardiovasculaire, coagulopathie, insuffisance rénale aiguë, mortalité proche de 100 %.","c":"Seuils"},{"id":"litfl-chloro","t":"Chloroquine and Hydroxychloroquine toxicity","a":"LITFL — Toxicology Library","y":"","u":"https://litfl.com/chloroquine-hydroxychloroquine-toxicity/","n":"> 10 mg/kg potentiellement toxique, > 30 mg/kg mortalité croissante, > 5 g chez l'adulte mortel sans intervention. Un seul comprimé peut être fatal chez l'enfant de moins de 6 ans. Délai : 1 à 2 h.","c":"Seuils"},{"id":"litfl-theo","t":"Theophylline toxicity","a":"LITFL — Toxicology Library","y":"","u":"https://litfl.com/theophylline-tox-library/","n":"> 10 mg/kg toxicité potentielle, > 50 mg/kg toxicité menaçant le pronostic vital. Formes à libération modifiée : pic jusqu'à 15 h. Dialyse si > 100 mg/L en aigu.","c":"Seuils"},{"id":"litfl-valp","t":"Sodium Valproate Overdose","a":"LITFL — Toxicology Library","y":"","u":"https://litfl.com/sodium-valproate-overdose/","n":"< 200 mg/kg effets mineurs, 200–400 mg/kg toxicité modérée, 400–1000 mg/kg toxicité sévère, > 1 g/kg menace vitale. Pic : 1–4 h (IR), 3–7 h (gastrorésistant), jusqu'à 18 h en surdosage.","c":"Seuils"},{"id":"litfl-sulfo","t":"Sulfonylurea toxicity","a":"LITFL — Toxicology Library","y":"","u":"https://litfl.com/sulfonylurea-toxicity/","n":"Chez l'enfant, un seul comprimé peut provoquer une hypoglycémie mortelle. Hypoglycémie habituellement dans les 8 h, vers 18 h avec les formes à libération prolongée, parfois retardée jusqu'à 48 h.","c":"Seuils"},{"id":"litfl-fer","t":"Iron ingestion","a":"LITFL — Toxicology Library","y":"","u":"https://litfl.com/iron-ingestion/","n":"Fer élément > 60 mg/kg : toxicité systémique potentielle. Fer sérique > 500 µg/dL à H4–H6 : chélation indiquée. Pas de toxicité systémique sans symptômes digestifs.","c":"Seuils"},{"id":"litfl-digifab","t":"Digoxin immune Fab (DigiFab)","a":"LITFL — Toxicology Library","y":"","u":"https://litfl.com/digibind-antidote/","n":"Indications en aigu : arrêt cardiaque, arythmie menaçante, K⁺ > 5 mmol/L, ingestion > 10 mg (adulte) ou > 4 mg (enfant), digoxinémie > 15 nmol/L. Dose empirique : 5 flacons si stable, 10 si instable, 20 en arrêt cardiaque.","c":"Antidotes"},{"id":"austin-flec","t":"Flecainide Guideline","a":"Austin Health / Victorian Poisons Information Centre","y":"Version 3, 2025","u":"https://austin.org.au/Assets/Files/Flecainide%20Guideline_V3_3_2025.pdf","n":"Toxicité significative attendue au-delà de 1000 mg. Effets dans les 1 à 2 h. Bicarbonate 8,4 % 1 ml/kg en IV lent sur 2 min, répété jusqu'à pH 7,50–7,55.","c":"Seuils"},{"id":"austin-carba","t":"Carbamazepine Guideline","a":"Austin Health / Victorian Poisons Information Centre","y":"2021","u":"https://austin.org.au/Assets/Files/Carbamazepine%20guideline%20_Final%20Sept%202021[1].pdf","n":"< 20 mg/kg effets mineurs, 20–50 mg/kg toxicité modérée, > 50 mg/kg toxicité sévère. Toxicité cyclique du fait de l'absorption retardée et des effets anticholinergiques.","c":"Seuils"},{"id":"austin-lamo","t":"Lamotrigine Guideline","a":"Austin Health / Victorian Poisons Information Centre","y":"2023","u":"https://austin.org.au/Assets/Files/Lamotrigine%20Guideline.Oct%202023[1].pdf","n":"> 20 mg/kg : toxicité modérée. Des décès par collapsus cardiovasculaire brutal sont rapportés dès 4 g. Sortie possible si asymptomatique à 6 h.","c":"Seuils"},{"id":"austin-olanz","t":"Olanzapine Guideline","a":"Austin Health / Victorian Poisons Information Centre","y":"2023","u":"https://austin.org.au/Assets/Files/Olanzapine%20Guideline.July%202023[1].pdf","n":"Toxicité attendue au-delà de 5 fois la dose usuelle ; > 400 mg : toxicité sévère avec coma. Toxidrome anticholinergique en 1 à 2 h, jusqu'à 4 h.","c":"Seuils"},{"id":"austin-metf","t":"Metformin Guideline","a":"Austin Health / Victorian Poisons Information Centre","y":"2024","u":"https://austin.org.au/Assets/Files/Metformin%20Guideline_July%202024.pdf","n":"< 10 g : surdosage aigu habituellement bien toléré. Hémodialyse si lactate > 20 mmol/L, pH < 7,0, choc, ou aggravation malgré le traitement. Pas d'hypoglycémie.","c":"Seuils"},{"id":"austin-salicyl","t":"Salicylate Guideline","a":"Austin Health / Victorian Poisons Information Centre","y":"Version 5, 2026","u":"https://www.austin.org.au/Assets/Files/Salicylate%20Guideline_V5_7_2026.pdf","n":"150–300 mg/kg : acouphènes, nausées, alcalose respiratoire. 300–500 mg/kg : convulsions, acidose métabolique, défaillance multiviscérale. > 500 mg/kg : potentiellement létal.","c":"Seuils"},{"id":"austin-ains","t":"NSAIDs Guideline","a":"Austin Health / Victorian Poisons Information Centre","y":"Version 4, 2026","u":"https://www.austin.org.au/Assets/Files/NSAIDs_V4_5_2026.pdf","n":"Ibuprofène : < 200 mg/kg toxicité improbable, 200–400 mg/kg toxicité digestive légère, > 400 mg/kg toxicité systémique possible. Acide méfénamique > 40 mg/kg : risque convulsif, surveillance 12 h.","c":"Seuils"},{"id":"austin-baclo","t":"Baclofen Guideline","a":"Austin Health / Victorian Poisons Information Centre","y":"Version 4, 2026","u":"https://www.austin.org.au/Assets/Files/Baclofen_V4_5_2026.pdf","n":"< 200 mg per os : effets habituellement mineurs sur le SNC. > 200 mg : gravité croissante avec la dose. Signes dans les 2 h. Ventilation parfois nécessaire au-delà de 72 h.","c":"Seuils"},{"id":"toxinfo-para","t":"Intoxication aiguë au paracétamol","a":"Tox Info Suisse / Pedworld","y":"Version février 2024","u":"https://pedworld.ch/ENTREE/INTOXICATIONS/INTOX%20AU%20PARACETAMOL/Intox%20aigue%20Paracetamol-ToxZentrum%202024.pdf","n":"Protocole NAC en 2 poches sur 20 h : dose totale 300 mg/kg, soit 200 mg/kg sur 4 h puis 100 mg/kg sur 16 h. Nomogramme de Rumack-Matthew : dosage au plus tôt 4 h après l'ingestion, ingestion aiguë unique d'horaire connu uniquement.","c":"Antidotes"},{"id":"cap-nitrite","t":"Augmentation inquiétante du nombre de tentatives de suicide par ingestion de nitrite de sodium","a":"Centres antipoison de France","y":"Alerte relayée par la SRLF et la SFMU","u":"https://www.srlf.org/sites/www.srlf.org/files/medias/documents/06juin2023_SuicidesParNitriteDeSodium_CentresAntipoisonDeFrance-1.pdf","n":"Hausse depuis 2020, mortalité de 40 % des cas rapportés en 2023. Bleu de méthylène le plus tôt possible : 1 à 2 mg/kg sans dépasser 100 mg, renouvelable. Exsanguino-transfusion ou OHB dans les formes réfractaires.","c":"Autolyse"},{"id":"cap-belgique-chloralose","t":"Intoxication aux rodenticides à base d'alpha-chloralose chez l'homme","a":"Centre Antipoisons belge","y":"Fiche pour professionnels de santé","u":"https://www.centreantipoisons.be/tox-infos/intoxication-aux-rodenticide-a-base-dalpha-chloralose-chez-lhomme-pour-professionnels-de-sante/","n":"1 g peut provoquer convulsions et coma chez l'adulte ; un comprimé de 200 mg a suffi chez le jeune enfant. Premiers symptômes à 1–2 h. Coma avec myoclonies, convulsions déclenchées par les stimuli, hypersécrétion bronchique.","c":"Autolyse"},{"id":"wikem-co","t":"Carbon monoxide toxicity","a":"WikEM","y":"","u":"https://wikem.org/wiki/Carbon_monoxide_toxicity/fr","n":"Demi-vie de la HbCO : ~5 h à l'air ambiant, ~1 h sous O₂ 100 %. Indications d'OHB : syncope, altération de l'état mental, convulsion, coma, déficit focal, grossesse avec HbCO > 15 %, HbCO > 25 %, ischémie myocardique aiguë.","c":"Contextes"},{"id":"wikem-h2s","t":"Hydrogen sulfide toxicity","a":"WikEM","y":"","u":"https://wikem.org/wiki/Hydrogen_sulfide_toxicity","n":"Paralysie olfactive à partir de 100 ppm : l'odeur n'est pas un indicateur de sécurité. 700–1000 ppm : perte de connaissance en 1 à 2 inspirations. Hydroxocobalamine 5 g IV préférée aux nitrites. Pas de thiosulfate.","c":"Contextes"},{"id":"echm-2016","t":"ECHM 2016 list of indications for hyperbaric oxygen therapy","a":"European Committee for Hyperbaric Medicine","y":"10e conférence européenne de consensus, 2016","u":"https://storage.snappages.site/1qs6360fks/assets/files/ECHM-2016-list-of-indications.pdf","n":"L'intoxication au monoxyde de carbone figure parmi les indications de type 1.","c":"Contextes"},{"id":"rdp-araignees","t":"Aranéisme","a":"La Revue du Praticien","y":"","u":"https://www.larevuedupraticien.fr/article/araneisme","n":"Latrodectisme (Latrodectus tredecimguttatus, surtout en Corse) : troubles neurovégétatifs et contractures abdominales. Loxoscélisme : syndrome viscéro-nécrotique local, atteinte générale rare.","c":"Envenimations"},{"id":"inspq-digifab","t":"DigiFab — fragments Fab antidigitaliques","a":"Institut national de santé publique du Québec, Bulletin d'information toxicologique","y":"Volume 28, n° 1","u":"https://www.inspq.qc.ca/sites/default/files/toxicologie-clinique/bit/bit_v28_n1_complet.pdf","n":"Indiqué pour les intoxications potentiellement létales par digoxine ou autre source d'hétéroside cardiotonique, y compris végétale. Pour les hétérosides autres que la digoxine, se référer au centre antipoison. Un flacon lie environ 0,5 mg de digoxine.","c":"Antidotes"},{"id":"fpn-cigue","t":"Poison Hemlock (Conium maculatum)","a":"FPnotebook","y":"","u":"https://mobile.fpnotebook.com/ER/Toxin/PsnHmlck.htm","n":"Coniine : agoniste puis antagoniste nicotinique. Phase précoce (mydriase, bronchorrhée, tachycardie) puis bradycardie et paralysie flasque ascendante avec paralysie respiratoire. Hémodialyse inefficace.","c":"Plantes"},{"id":"ciusss-chelateurs","t":"Chélateurs (hors déféroxamine)","a":"CIUSSS de la Capitale-Nationale — Centre antipoison du Québec","y":"","u":"https://www.ciusss-capitalenationale.gouv.qc.ca/en/antidotes/chelating-agents-excluding-deferoxamine","n":"Plomb : succimer (DMSA) ou EDTA calcique associé au dimercaprol (BAL). Mercure et arsenic : BAL ou DMPS. Consultation du centre antipoison avant toute chélation ; celle-ci peut être indiquée dans les 2 h suivant le diagnostic d'intoxication aiguë.","c":"Contextes"},{"id":"seslhd-psy","t":"Psychiatric medications and their toxidromes","a":"South Eastern Sydney Local Health District — synthèse Tintinalli","y":"","u":"https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/POWHED/docs/Tintinalli_Summary/Toxicology/PSYCHIATRICMEDICATIONSANDTHEIR%20OXIDROMES.pdf","n":"Mirtazapine : ingestions pédiatriques jusqu'à 100 mg sans effet grave. Rispéridone : chez l'enfant, > 1 mg donne léthargie et syndrome extrapyramidal. Clozapine : chez l'enfant, > 2,5 mg/kg.","c":"Seuils"},{"id":"ansm-viperfav-viperatab","t":"Remise à disposition de VIPERFAV : attention aux différences entre VIPERFAV et VIPERATAB et au risque d'erreur médicamenteuse","a":"ANSM","y":"Actualité et DHPC","u":"https://ansm.sante.fr/actualites/remise-a-disposition-de-la-specialite-viperfav-attention-aux-differences-entre-viperfav-et-viperatab-et-au-risque-derreur-medicamenteuse","n":"VIPERFAV : F(ab')₂ équins, V. aspis/berus/ammodytes, dose initiale 4 ml dans 100 ml de NaCl 0,9 % sur 1 h, jusqu'à 2 renouvellements à 5 h d'intervalle. VIPERATAB : Fab ovins, V. berus uniquement, dose initiale 8 ml dans 100 ml de NaCl 0,9 % sur 30 min, renouvellement systématique une fois (deux fois pour V. aspis) à 4 h d'intervalle. Avis du centre antipoison avant administration et avant renouvellement.","c":"Envenimations"},{"id":"hcl-viperes","t":"Morsures de vipères — protocole","a":"Hospices Civils de Lyon, réseau des urgences Auvergne-Rhône-Alpes","y":"Version 1.0, juin 2025","u":"https://www.urgences-ara.fr/app/uploads/2025/07/202506_AUTRES_Morsures_viperes_HCL_V1.0.pdf","n":"Grades 0 à III avec sous-grades IIA et IIB. Critères biologiques de gravité du grade IIB : leucocytes > 15 000/mm³, plaquettes < 150 000/mm³, TP < 60 %, fibrinogène < 2 g/L. Surveillance 6 h au grade 0, 24 h au grade I avec bilan biologique à 12 h.","c":"Envenimations"},{"id":"sfmu-viperes","t":"Immunsérum antivenin de vipères · Morsures et piqûres par animaux venimeux en France","a":"Société Française de Médecine d'Urgence","y":"Base Toxin et actes du congrès Urgences","u":"https://www.sfmu.org/toxin/ANTIDOTE/SANTVENI.HTM","n":"Seules les vipères sont venimeuses pour l'homme en France métropolitaine. Pas de garrot, pas d'incision, pas d'aspiration. Distinction des traces : deux crochets espacés pour la vipère, arc de petites marques dentaires pour les couleuvres.","c":"Envenimations"},{"id":"info-bmpm-anticoag","t":"Infographie « Hémorragie sévère & anticoagulants »","a":"Dr Pierre Balaz, SMUR BMPM","y":"@SMURBMPM13 — @SMURBMPM","u":"https://smurbmpm.fr","n":"Document fourni par l'auteur. Critères d'hémorragie grave et conduites de réversion pour AVK, anti-Xa, dabigatran, HNF et HBPM, avec le cas particulier de l'AVC ischémique.","c":"Antidotes"},{"id":"sfar-anticoag","t":"Gestion de l'anticoagulation dans un contexte d'urgence","a":"Société Française d'Anesthésie et de Réanimation","y":"Référentiel SFAR","u":"https://sfar.org/gestion-de-lanticoagulation-dans-un-contexte-durgence/","n":"Référence citée par l'infographie SMUR BMPM sur l'hémorragie sévère et les anticoagulants.","c":"Antidotes"},{"id":"crediblemeds","t":"QTdrugs lists — médicaments allongeant le QT et risque de torsades de pointes","a":"CredibleMeds, AZCERT (Arizona Center for Education and Research on Therapeutics)","y":"Base de référence internationale","u":"https://crediblemeds.org/","n":"Classement des médicaments en risque connu, possible ou conditionnel de torsades de pointes. Référence utilisée pour la liste des molécules allongeant le QT et pour les facteurs favorisants.","c":"Seuils"},{"id":"smurbmpm-champi","t":"Les intoxications aux champignons — contenu pédagogique","a":"SMUR BMPM","y":"smurbmpm.fr","u":"https://smurbmpm.fr/contenu-pedagogique/les-intoxications-aux-champignons/","n":"Vue globale en ligne, complémentaire des fiches de syndromes de cette application.","c":"Champignons"},{"id":"smurbmpm-drogues","t":"Les drogues — contenu pédagogique","a":"SMUR BMPM","y":"smurbmpm.fr","u":"https://smurbmpm.fr/contenu-pedagogique/les-drogues/","n":"Vue globale en ligne, complémentaire des fiches de cette application.","c":"Drogues"},{"id":"smurbmpm-flamme","t":"La flamme — fumées d'incendie","a":"SMUR BMPM","y":"smurbmpm.fr","u":"https://smurbmpm.fr/toxicologie/la-flamme/","n":"Vue globale en ligne sur les fumées d'incendie.","c":"NRBC / Drogues"},{"id":"photos-balaz","t":"Photographies cliniques et de conditionnements","a":"Dr Pierre Balaz","y":"Clichés personnels","u":"","n":"Les photographies de cette application (nitrite de sodium, SNIPER/DDVP, raticide à l'alpha-chloralose, loxoscélisme, morsure de vipère, morsure de couleuvre) ont été prises par l'auteur. Les clichés cliniques l'ont été avec l'accord des patients.","c":"Iconographie"},{"id":"smurbmpm-nrbc","t":"NRBC — les agents chimiques","a":"SMUR BMPM","y":"smurbmpm.fr","u":"https://smurbmpm.fr/toxicologie/nrbc-les-agents-chimiques/","n":"Vue globale en ligne sur les agents chimiques : neurotoxiques organophosphorés, vésicants, suffocants, cyanés. Complémentaire des fiches NRBC de cette application.","c":"NRBC / Drogues"}]};

function solveKa(t12,tmax){
const ke=Math.LN2/t12;
if(!(tmax>0)||tmax>=1/ke) return ke*6;
let lo=ke*1.0001, hi=ke*5000;
const f=ka=>Math.log(ka/ke)/(ka-ke)-tmax;
if(f(hi)>0) return hi;
for(let i=0;i<80;i++){ const m=(lo+hi)/2; if(f(m)>0) lo=m; else hi=m; }
return (lo+hi)/2;
}
const conc=(t,ke,ka)=> t<=0?0:(ka/(ka-ke))*(Math.exp(-ke*t)-Math.exp(-ka*t));
function pkCurve(t12,tmax,tEnd){
const ke=Math.LN2/t12, ka=solveKa(t12,tmax), peak=conc(tmax,ke,ka)||1, pts=[];
for(let i=0;i<=160;i++){ const t=tEnd*i/160; pts.push([t,conc(t,ke,ka)/peak]); }
return {pts, at:t=>conc(t,ke,ka)/peak};
}
function thrMg(th,poids){
const [lv,u,v]=th;
if(u==="mg") return v; if(u==="g") return v*1000; if(u==="µg") return v/1000;
if(u==="mg/kg") return v*poids; return null;
}
function thrUI(th){ return th[1]==="UI" ? th[2] : null; }
function gravite(med,doseMg,poids,isUI){
const list=med.s.map(t=>({lv:t[0],mg:isUI?thrUI(t):thrMg(t,poids),lbl:t[3]})).filter(x=>x.mg!=null);
if(!list.length) return {lv:-1,pct:0,list:[],next:null};
let lv=0, cross=null;
list.forEach(x=>{ if(doseMg>=x.mg && x.lv>lv){ lv=x.lv; cross=x; } });
const by={}; list.forEach(x=>{ if(!by[x.lv]||x.mg<by[x.lv].mg) by[x.lv]=x; });
const t1=by[1]&&by[1].mg, t2=by[2]&&by[2].mg, t3=by[3]&&by[3].mg;
const seg=(a,b,lo,hi)=>Math.max(lo,Math.min(hi,lo+(hi-lo)*(doseMg-a)/Math.max(b-a,1e-9)));
let pct;
if(t1&&doseMg<t1) pct=Math.min(24,24*doseMg/t1);
else if(t1&&t2&&doseMg<t2) pct=seg(t1,t2,25,49);
else if(t2&&t3&&doseMg<t3) pct=seg(t2,t3,50,74);
else if(t3&&doseMg>=t3) pct=Math.min(100,75+25*Math.min(1,(doseMg-t3)/t3));
else if(t2&&doseMg>=t2) pct=Math.min(90,50+40*Math.min(1,(doseMg-t2)/t2));
else if(t1&&doseMg>=t1) pct=Math.min(70,25+45*Math.min(1,(doseMg-t1)/t1));
else pct=10;
return {lv,pct,cross,list,next:list.filter(x=>x.mg>doseMg).sort((a,b)=>a.mg-b.mg)[0]||null};
}

function plotPK(cv,m,h){

const area=d+` L${X(tEnd).toFixed(1)} ${B} L${X(0).toFixed(1)} ${B} Z`;
const hx=X(Math.min(h,tEnd)), hy=Y(cv.at(Math.min(h,tEnd)));

return `<text class="al" x="${X(t).toFixed(1)}" y="${B+14}" text-anchor="middle">${t<10?t.toFixed(t<1?1:0):Math.round(t)}</text>`;}).join("");

<path d="${d}" fill="none" stroke="var(--accent2)" stroke-width="2.2"/>
<line class="ax" x1="${L}" y1="${B}" x2="${R}" y2="${B}"/><line class="ax" x1="${L}" y1="${B}" x2="${L}" y2="${T}"/>

<span style="font-weight:750;font-size:.89rem;color:var(--ink2)">${esc(it.n)}</span>

${it.nt?`<p class="xs muted" style="margin-top:4px">${esc(it.nt)}</p>`:""}
${srcLinks(it.src)}</div>`).join("")}
</div>`).join("")}`;
const draw=()=>{
const q=norm($("#aq").value.trim());
$("#alist").innerHTML = DB.antidotes.map(g=>{
const items=g.items.filter(a=>!q||norm(a.tox).includes(q)||norm(a.ant).includes(q)||norm(a.ind.join(" ")).includes(q));
if(!items.length) return "";
return `<div class="lbl" style="margin:16px 0 7px">${esc(g.g)}<span style="display:block;text-transform:none;letter-spacing:0;font-weight:600;margin-top:2px">${esc(g.sub)}</span></div>
<div class="card pad0">`+items.map(a=>{
const k=DB.antidotes.indexOf(g)+"-"+g.items.indexOf(a);
return `<button class="ta" data-k="${k}">
<div><div class="tox">${esc(a.tox)}</div>${a.ep.map(epBadge).join("")}</div>
<div class="arr">→</div>
<div><div class="ant">${esc(a.ant)}</div><div class="xs muted">${esc(a.d)} · ${esc(a.c)}</div></div></button>`;}).join("")+`</div>`;
}).join("") || `<div class="card empty">Aucun résultat.</div>`;
$("#alist").querySelectorAll(".ta").forEach(b=> b.onclick=()=>{
const [gi,ai]=b.dataset.k.split("-").map(Number); showAnt(DB.antidotes[gi].items[ai]); });
};
$("#aq").oninput=draw; draw();
}
function showAnt(a){
sheet(`<h3>${esc(a.ant)}</h3>
<p class="sm muted" style="margin:5px 0 12px">Toxique : ${esc(a.tox)}</p>
<div class="card"><table class="kv">
<tr><th>Disponibilité</th><td>${esc(a.d)}</td></tr>
<tr><th>Niveau de preuve</th><td>${esc(a.c)}</td></tr></table>
${a.ep.length?`<div style="margin-top:9px">${a.ep.map(epBadge).join("")}</div>`:""}</div>

${a.nt?`<div class="card"><div class="lbl">Remarque</div><p class="sm">${esc(a.nt)}</p></div>`:""}
${srcLinks(a.src)}`);

function renderMeds(){
const cls=[...new Set(DB.meds.map(m=>m.c.split(" (")[0]))].sort();
$("#s-meds").innerHTML = `
<h2 class="pt">Médicaments</h2>
<p class="ps">${DB.meds.length} molécules : demi-vie, pic plasmatique, seuils et conduite.</p>
<div class="card"><input id="mq" placeholder="Rechercher une molécule ou une marque…" autocomplete="off">
<select id="mf" style="margin-top:9px"><option value="">Toutes les classes</option>${cls.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
<div id="mlist"></div>`;
const draw=()=>{
const q=norm($("#mq").value.trim()), f=$("#mf").value;
const hits=DB.meds.filter(m=>(!f||m.c.startsWith(f))&&(!q||norm(m.n).includes(q)||(m.syn||[]).some(s=>norm(s).includes(q))||norm(m.c).includes(q)||norm(m.sg).includes(q)));
$("#mlist").innerHTML = hits.length
? `<div class="card pad0">`+hits.map(m=>`<button class="med" onclick="showMed('${encodeURIComponent(m.n)}')">
<div><div class="mn">${esc(m.n)}${m.lpx?` <span class="tag lp" style="margin:0">${esc(m.lpx.lbl)}</span>`:""}</div>
<div class="mc">${esc(m.c)}${m.syn&&m.syn.length?" · "+esc(m.syn.join(", ")):""}</div></div><span class="ma">›</span></button>`).join("")+`</div>`
: `<div class="card empty">Aucun résultat.</div>`;
};
$("#mq").oninput=draw; $("#mf").onchange=draw; draw();
}
function showMed(enc){
const m=DB.meds.find(x=>x.n===decodeURIComponent(enc)); if(!m) return;
sheet(`<h3>${esc(m.n)}</h3>
<p class="sm muted" style="margin:5px 0 12px">${esc(m.c)}${m.syn&&m.syn.length?" · "+esc(m.syn.join(", ")):""}</p>
<div class="card"><div class="lbl">Cinétique</div><table class="kv">
<tr><th>Demi-vie</th><td>${esc(m.t12)}</td></tr>
<tr><th>Pic plasmatique</th><td>${esc(m.tmax)}</td></tr>
${m.lpx?`<tr><th>Forme ${esc(m.lpx.lbl)}</th><td>Pic à ${m.lpx.tmax} h · surveillance ${m.lpx.obs} h</td></tr>`:""}
<tr><th>Surveillance</th><td>${m.obs} h minimum si asymptomatique</td></tr></table></div>
<div class="card"><div class="lbl">Seuils de surveillance</div>
${m.s.map(t=>`<div style="display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line)">
<span class="tag ${t[0]>=3?"red":t[0]===2?"amb":"grn"}" style="margin:0">${t[2]} ${esc(t[1])}</span>
<span class="xs">${esc(t[3])}</span></div>`).join("")}</div>
<div class="card"><div class="lbl">Signes</div><p class="sm">${esc(m.sg)}</p>
<div class="hr"></div><div class="lbl">Antidote / traitement</div><p class="sm">${esc(m.anti)}</p></div>
<div class="card"><div class="lbl">Point clé</div><p class="sm">${esc(m.cle)}</p>${srcLinks(m.src)}</div>
<button class="b pri" style="width:100%" onclick="useMed('${encodeURIComponent(m.n)}')">Utiliser dans le calculateur</button>`);
}
function useMed(enc){
const m=DB.meds.find(x=>x.n===decodeURIComponent(enc));
const slot = CS.ent.find(e=>!e.med);
if(slot){ slot.med=m; slot.lp=false; } else CS.ent.push({id:++uid,med:m,nb:1,dose:"",unit:1,lp:false});
closeSheet(); go("calcul"); drawMoles(); calc();
}

$("#s-fiches").innerHTML = `
<h2 class="pt">Fiches détaillées</h2><p class="ps">NRBC, drogues récréatives et syndromes des champignons.</p>`+
cats.map(c=>`<div class="lbl" style="margin:14px 0 7px">${esc(c)}</div>${lienHTML(DB.fiche_liens[c])}<div class="tiles">`+
DB.fiches.filter(f=>f.cat===c).map(f=>`<button class="tile" onclick="showFiche('${f.id}')">

<p class="sm muted" style="margin:5px 0 12px">${esc(f.cat)}${f.tri?` · <b style="color:var(--g4)">${esc(f.tri)}</b>`:""}</p>

${f.frise?`<div class="card"><div class="lbl">Voies de prise</div>${friseHTML()}</div>`
:`<div class="card"><div class="lbl">Signes</div><ul class="li">${f.signes.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`}

}
function renderRfe(){
$("#s-rfe").innerHTML = `
<h2 class="pt">Recommandations RFE</h2>
<p class="ps">Prise en charge des intoxications médicamenteuses et par drogues récréatives — SRLF / SFMU.</p>`+
DB.rfe.map(r=>`<div class="card">
<div style="display:flex;gap:8px;align-items:baseline;margin-bottom:5px">
<span class="tag blu" style="margin:0;font-weight:900">${esc(r.id)}</span><span class="tag" style="margin:0">${esc(r.g)}</span></div>
<p class="sm">${esc(r.t)}</p></div>`).join("")+
`<div class="lbl" style="margin:18px 0 7px">Rappels</div>

let IDX=null;
function buildIndex(){
const ix=[];
DB.meds.forEach(m=>ix.push({t:m.n,s:"Médicament · "+m.c,
b:[m.n,(m.syn||[]).join(" "),m.c,m.sg,m.cle,m.anti,m.t12,m.tmax].join(" "),go:()=>showMed(encodeURIComponent(m.n))}));
DB.fiches.forEach(f=>ix.push({t:f.t,s:"Fiche · "+f.cat,
b:[f.t,f.meca,f.delai,f.signes.join(" "),f.pec.join(" "),f.ex,f.cle].join(" "),go:()=>showFiche(f.id)}));
DB.contextes.forEach(c=>c.items.forEach(it=>ix.push({t:it.a,s:"Environnement · "+c.cat,
b:[it.a,it.s,it.t,it.nt].join(" "),
go:()=> it.f&&FICHE[it.f] ? showFiche(it.f) : sheet(`<h3>${esc(it.a)}</h3>
<p class="sm muted" style="margin:5px 0 12px">${esc(c.cat)}</p>
<div class="card"><div class="lbl">Signes</div><p class="sm">${esc(it.s)}</p></div>
<div class="card"><div class="lbl">Conduite</div><p class="sm">${esc(it.t)}</p></div>
${it.nt?`<div class="card"><div class="lbl">Note</div><p class="sm">${esc(it.nt)}</p></div>`:""}${srcLinks(it.src)}`)})));
DB.antidotes.forEach(g=>g.items.forEach(a=>ix.push({t:a.tox+" → "+a.ant,s:"Antidote · "+g.g,
b:[a.tox,a.ant,a.ind.join(" "),a.c,a.nt].join(" "),go:()=>showAnt(a)})));
DB.epurtox.forEach(g=>g.items.forEach(it=>ix.push({t:it.n+" → "+it.tech,s:"Épuration · "+g.titre,
b:[it.n,it.tech,it.ind.join(" "),it.nt,g.p].join(" "),
go:()=>{go("antidotes"); setTimeout(()=>document.getElementById("ep-"+g.tech).scrollIntoView({behavior:"smooth"}),80);}})));
Object.keys(TX).forEach(k=>ix.push({t:TX[k].nom,s:"Toxidrome",
b:[TX[k].nom,TX[k].f.join(" "),TX[k].cle,TX[k].anti].join(" "),
go:()=>sheet(`<h3>${esc(TX[k].nom)}</h3><p class="sm muted" style="margin:5px 0 12px">Toxidrome</p>
<div class="card"><table class="kv">${ROWS.map((r,i)=>`<tr><th>${r}</th><td>${esc(TX[k].f[i])}</td></tr>`).join("")}</table></div>
<div class="card"><div class="lbl">Point clé</div><p class="sm">${esc(TX[k].cle)}</p>
<div class="hr"></div><div class="lbl">Conduite</div><p class="sm">${esc(TX[k].anti)}</p></div>`)}));
DB.rfe.forEach(r=>ix.push({t:r.id+" — "+r.t.slice(0,52)+"…",s:"Recommandation · "+r.g,b:r.id+" "+r.t,
go:()=>sheet(`<h3>${esc(r.id)}</h3><p class="sm muted" style="margin:5px 0 12px">${esc(r.g)}</p>
<div class="card"><p class="sm">${esc(r.t)}</p></div>`)}));
DB.sources.forEach(s=>ix.push({t:s.t,s:"Source · "+s.c,b:[s.t,s.a,s.n,s.y].join(" "),go:()=>showSrc(s.id)}));
ix.forEach(x=>x._b=norm(x.b));
return ix;
}
function renderRecherche(){
$("#s-recherche").innerHTML = `
<h2 class="pt">Recherche</h2>
<p class="ps">Dans les médicaments, fiches, environnements, antidotes, épuration, toxidromes, recommandations et sources.</p>
<div class="card"><input id="qq" placeholder="atropine, QRS large, myosis, ECMO, 3MMC…" autocomplete="off"></div>
<div id="qres"><div class="card empty">Saisissez au moins deux caractères.</div></div>`;
$("#qq").oninput=()=>{
if(!IDX) IDX=buildIndex();
const raw=$("#qq").value.trim(), q=norm(raw);
if(q.length<2){ $("#qres").innerHTML=`<div class="card empty">Saisissez au moins deux caractères.</div>`; return; }
const hits=IDX.map(x=>{ const i=x._b.indexOf(q); return i<0?null:{x,sc:(norm(x.t).includes(q)?0:1000)+i}; })
.filter(Boolean).sort((a,b)=>a.sc-b.sc).slice(0,60);
if(!hits.length){ $("#qres").innerHTML=`<div class="card empty">Aucun résultat pour « ${esc(raw)} ».</div>`; return; }
$("#qres").innerHTML=`<p class="xs muted" style="margin-bottom:8px">${hits.length} résultat${hits.length>1?"s":""}</p><div class="card pad0">`+
hits.map((h,i)=>{ const x=h.x, j=x._b.indexOf(q), ctx=x.b.slice(Math.max(0,j-42),j+90).trim();
return `<button class="med" data-k="${i}"><div style="min-width:0">
<div class="mn">${esc(x.t)}</div><div class="mc">${esc(x.s)}</div>
<div class="xs muted" style="margin-top:3px">…${hl(ctx,raw)}…</div></div><span class="ma">›</span></button>`;}).join("")+`</div>`;
$("#qres").querySelectorAll(".med").forEach((b,i)=> b.onclick=()=>hits[i].x.go());
};
}
function hl(txt,q){
const n=norm(txt), i=n.indexOf(norm(q));
if(i<0) return esc(txt);
return esc(txt.slice(0,i))+"<mark>"+esc(txt.slice(i,i+q.length))+"</mark>"+esc(txt.slice(i+q.length));
}

$("#s-sources").innerHTML = `

renderAccueil(); renderCalcul(); renderToxidromes(); renderContexte(); renderAntidotes();
renderMeds(); renderFiches(); renderRfe(); renderRecherche(); renderSources();
</script>
